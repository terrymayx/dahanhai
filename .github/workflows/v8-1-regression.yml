name: V8.1 Regression
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V8.1 structure
        run: node tests/v8_1_structure_break.test.js
      - name: V8.1 penetration
        run: node tests/v8_1_penetration.test.js
      - name: V8.1 aiming
        run: node tests/v8_1_aiming.test.js
      - name: V8.1 feedback
        run: node tests/v8_1_feedback_contract.test.js
