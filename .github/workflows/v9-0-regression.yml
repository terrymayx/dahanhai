name: V9.0 Full Regression

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V9.0 vector geometry
        run: node tests/v9_0_vector_geometry.test.js
      - name: V9.0 organic ship visuals
        run: node tests/v9_0_damage_visual_contract.test.js
      - name: V9.0 renderer integration
        run: node tests/v9_0_render_integration.test.js
      - name: V9.0 entry contract
        run: node tests/v9_0_entry_contract.test.js
