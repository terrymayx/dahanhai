name: V10.2 Regression

on:
  push:
    branches: [ main ]

jobs:
  test-v102:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V10.2 focused regression
        shell: bash
        run: |
          set -e
          for t in \
            tests/v10_2_ammo_profiles.test.js \
            tests/v10_2_player_ammo.test.js \
            tests/v10_2_first_layer.test.js \
            tests/v10_2_damage_roles.test.js \
            tests/v10_2_explosive_effects.test.js \
            tests/v10_2_chunk_ammo.test.js \
            tests/v10_2_hud_ui.test.js \
            tests/v10_2_integration.test.js; do
            echo "== $t =="
            node "$t"
          done
      - name: V10.2 changed-module syntax
        shell: bash
        run: |
          set -e
          for f in \
            js/v8/20_projectiles.js \
            js/v8/32_v954_impact_explosion.js \
            js/v8/33_v972_player_attack.js \
            js/v8/34_v99_material.js \
            js/v8/34_v102_ammo.js \
            js/v8/37_fire_damage.js \
            js/v8/43_v101_chunk_damage.js \
            js/v8/47_v97_status_overlay.js \
            js/v8/48_v976_attack_control.js \
            js/v8/49_v102_ammo_control.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done
