name: V8.5 TDD
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V8.5 contracts
        shell: bash
        run: |
          set -e
          for t in tests/v8_5*.test.js; do echo "== $t =="; node "$t"; done
