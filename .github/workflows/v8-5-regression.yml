name: V8.5 TDD
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V8.5 contracts
        shell: bash
        run: |
          set -e
          node tests/v8_5_damage_stage.test.js
          node tests/v8_5_penetration_gate.test.js
          node tests/v8_5_flooding.test.js
