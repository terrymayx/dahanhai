name: V8.5.1 Full Regression
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V8.5.1 no-flooding contract
        run: node tests/v8_5_1_no_flooding.test.js
      - name: V8 full regression
        shell: bash
        run: |
          set -e
          for t in tests/v8_5_1*.test.js tests/v8_5*.test.js tests/v8_4*.test.js tests/v8_3*.test.js tests/v8_2*.test.js tests/v8_1*.test.js tests/v8_0*.test.js; do
            echo "== $t =="
            node "$t"
          done
      - name: JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in js/v8/*.js; do node --check "$f"; done
      - name: Legacy V6/V7 regression
        shell: bash
        run: |
          set -e
          cp index.html /tmp/v8-index.html
          cp legacy_v7.html index.html
          for t in tests/v6*.test.js tests/v7*.test.js; do echo "== $t =="; node "$t"; done
          cp /tmp/v8-index.html index.html
          git diff --exit-code
