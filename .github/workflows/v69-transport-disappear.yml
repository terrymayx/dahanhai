name: V6.9 Transport Disappear
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done
      - name: Run transport disappear regression
        run: node tests/v6_9_side_retreat.test.js
