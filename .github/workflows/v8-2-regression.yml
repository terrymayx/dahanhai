name: V8.2 Regression
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V8.2 components
        run: node tests/v8_2_components.test.js
      - name: V8.2 material penetration
        run: node tests/v8_2_material_penetration.test.js
      - name: V8.2 powder chain and systems
        run: node tests/v8_2_powder_chain.test.js
