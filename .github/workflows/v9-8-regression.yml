name: V9.8 Regression

on:
  push:
    branches: [ main ]

jobs:
  test-v98:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V9.8 focused regression
        shell: bash
        run: |
          set -e
          for t in tests/v9_0_v98*.test.js; do
            [ -e "$t" ] || continue
            echo "== $t =="
            node "$t"
          done
      - name: V9.8 changed-module syntax
        shell: bash
        run: |
          set -e
          for f in \
            js/v8/20_projectiles.js \
            js/v8/32_v954_impact_explosion.js \
            js/v8/33_v972_player_attack.js \
            js/v8/34_v98_armor.js \
            js/v8/42_v98_heavy_feedback.js \
            js/v8/47_v97_status_overlay.js \
            js/v8/48_v976_attack_control.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done
