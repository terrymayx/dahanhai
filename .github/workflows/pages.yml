name: Deploy latest deck guard demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.deploy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build latest mobile swarm guard demo
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/source.part.* > /tmp/public_deck_guard_mode.zip
          echo "18a5d7d6a514b814a652a3027f9bc19269498f1ff1a1b6bfa40e2bf3a750b09a  /tmp/public_deck_guard_mode.zip" | sha256sum -c -

          rm -rf /tmp/latest_guard _site
          mkdir -p /tmp/latest_guard _site/downloads
          unzip -q /tmp/public_deck_guard_mode.zip -d /tmp/latest_guard

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/latest_guard')

          # ----- Keep only the newest Deck Guard entry -----
          html_path = root / 'index.html'
          html = html_path.read_text(encoding='utf-8')
          html = re.sub(r'<nav class="mode-switch">.*?</nav>', '', html, flags=re.S)
          html = html.replace('甲板守卫＋机动海战', '持续航行·甲板守卫')
          html = html.replace(
              '蔚蓝航路 2.5D 海战：持续航行·甲板守卫与机动海战双模式试玩。',
              '蔚蓝航路 2.5D 海战：持续航行·甲板守卫在线试玩。'
          )
          html = re.sub(
              r'<script src="combat\.js"></script><script>\(function\(\).*?</script>',
              '<script src="combat.js"></script><script src="guard.js"></script>',
              html,
              flags=re.S,
          )
          html = re.sub(r'<meta name="build"[^>]*>\s*', '', html)
          html = html.replace(
              '</head>',
              '<meta name="build" content="deck-guard-mobile-swarm-2026-09-07">\n</head>'
          )

          # Live enemy ship count in the compact ship card.
          stats_old = '<div class="ship-stats"><span>⚒ 修理 <b id="repairUses">2</b></span><span>⚑ <b id="kills">0</b> / <b id="enemyTotal">2</b></span></div>'
          stats_new = '<div class="ship-stats"><span>⚒ <b id="repairUses">2</b></span><span>⚑ <b id="kills">0</b>/<b id="enemyTotal">14</b></span><span class="enemy-live">⚔ 敌船 <b id="enemyCountLive">0</b></span></div>'
          if stats_old in html:
              html = html.replace(stats_old, stats_new)
          elif 'enemyCountLive' not in html:
              html = html.replace('</section>\n<section class="mission">', '<div class="enemy-fleet-badge">⚔ 敌船 <b id="enemyCountLive">0</b></div></section>\n<section class="mission">', 1)
          html_path.write_text(html, encoding='utf-8')

          # ----- Swarm gameplay: many small boats, max 5 ships visible/active, max 2 boarding entrances -----
          guard_path = root / 'guard.js'
          guard = guard_path.read_text(encoding='utf-8')
          guard = guard.replace(
              "if(tabs)tabs.innerHTML='<button class=\"active\">甲板守卫</button><button id=\"legacyModeBtn\">机动海战对照</button>';const legacy=$('legacyModeBtn');if(legacy)legacy.onclick=()=>location.href=location.pathname+'?mode=legacy';",
              "if(tabs)tabs.innerHTML='<button class=\"active\">甲板守卫</button>';"
          )
          guard = guard.replace(
              '<p><b>模式</b> 顶部“机动海战对照”可切回上一版自由机动战斗。</p>',
              ''
          )
          guard = guard.replace(
              '可以立即重玩或切回机动海战对照。',
              '可以立即重玩继续挑战。'
          )

          guard = re.sub(
              r"const PLAYER_X=920, PLAYER_Y=1060, PLAYER_SCALE=1\.75, AUTO_SPEED=105, VOLLEY_RELOAD=12, MAX_OPEN=2;",
              "const PLAYER_X=920, PLAYER_Y=1060, PLAYER_SCALE=1.75, AUTO_SPEED=105, VOLLEY_RELOAD=12, MAX_OPEN=2, MAX_ACTIVE_SHIPS=5, SWARM_TOTAL=14;",
              guard,
              count=1,
          )

          new_waves = """const WAVES=[
 {at:3,label:'双艇试探',spawns:[{type:'skiff',side:'upper'},{type:'skiff',side:'lower',delay:4}]},
 {at:38,label:'小艇连续压迫',spawns:[{type:'skiff',side:'lower'},{type:'skiff',side:'upper',delay:5},{type:'skiff',side:'lower',delay:11}]},
 {at:80,label:'掩护艇带队',spawns:[{type:'support',side:'upper'},{type:'skiff',side:'lower',delay:3},{type:'skiff',side:'upper',delay:10}]},
 {at:125,label:'中艇突破',spawns:[{type:'medium',side:'upper'},{type:'skiff',side:'lower',delay:5}]},
 {at:175,label:'大船压舷',spawns:[{type:'large',side:'lower'},{type:'skiff',side:'upper',delay:9}]},
 {at:235,label:'小艇收尾围攻',spawns:[{type:'skiff',side:'upper'},{type:'skiff',side:'lower',delay:8}]}
];"""
          guard, n = re.subn(r"const WAVES=\[.*?\n\];(?=\nconst SHIP_CFG=)", new_waves, guard, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not patch WAVES')

          guard = guard.replace(
              "skiff:{name:'快速运兵艇',hp:190,speed:150,crew:4,boarders:5,connectHp:85,size:.74,range:500}",
              "skiff:{name:'快速运兵艇',hp:165,speed:155,crew:3,boarders:4,connectHp:72,size:.72,range:500}"
          )
          guard = guard.replace('deckEnemyCount()<=9&&state.openEntrances<2', 'deckEnemyCount()<=10&&state.openEntrances<MAX_OPEN')
          guard = guard.replace('activeThreats()<4', 'activeThreats()<MAX_ACTIVE_SHIPS')

          # The live count shows current sea threats, while total shows the planned 14-ship challenge.
          guard = guard.replace(
              "$('enemyTotal').textContent=state.enemies.filter(e=>!e.removed).length;",
              "$('enemyTotal').textContent=SWARM_TOTAL;const liveEnemy=$('enemyCountLive');if(liveEnemy)liveEnemy.textContent=activeThreats();"
          )
          guard = guard.replace(
              "$('missionText').textContent=`第 ${Math.min(state.waveIndex+1,WAVES.length)} / ${WAVES.length} 波 · 甲板敌人 ${deckEnemyCount()} · 开放入口 ${openCount()}/${MAX_OPEN}`;",
              "$('missionText').textContent=`第 ${Math.min(state.waveIndex+1,WAVES.length)} / ${WAVES.length} 波 · 海上敌船 ${activeThreats()}/${MAX_ACTIVE_SHIPS} · 甲板敌人 ${deckEnemyCount()} · 登船口 ${openCount()}/${MAX_OPEN}`;"
          )
          guard = guard.replace(
              "const r=[],ok=(n,c)=>r.push({name:n,pass:!!c});const p=state.player;",
              "const r=[],ok=(n,c)=>r.push({name:n,pass:!!c});const p=state.player;ok('围攻总船数14',SWARM_TOTAL===14&&WAVES.reduce((n,w)=>n+w.spawns.length,0)===14);ok('小艇为主要威胁',WAVES.flatMap(w=>w.spawns).filter(s=>s.type==='skiff').length>=10);ok('同屏最多五艘敌船',MAX_ACTIVE_SHIPS===5);ok('登船入口仍最多两个',MAX_OPEN===2);"
          )
          guard_path.write_text(guard, encoding='utf-8')

          # ----- Mobile landscape HUD -----
          css_path = root / 'style.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* mobile-landscape-guard */'
          if marker not in css:
              css += r'''

/* mobile-landscape-guard */
.enemy-live{white-space:nowrap;color:#ffd98a}.enemy-live b{color:#ffb47d!important}
@media (orientation:landscape) and (max-width:1100px), (orientation:landscape) and (max-height:540px){
  html,body,#game{width:100%;height:100%;height:100dvh;min-height:0;overscroll-behavior:none}
  #game{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .topbar{height:43px;padding:0 max(8px,env(safe-area-inset-left)) 0 max(8px,env(safe-area-inset-right));z-index:8;background:linear-gradient(#052d3de8,#073545a8)}
  .brand{gap:6px}.brand-icon{font-size:23px}.brand strong{font-size:14px;letter-spacing:1px}.brand small,.tag,.location{display:none}
  .tools{gap:5px}.tools button{width:36px;height:36px;min-width:36px;min-height:36px;padding:0;font-size:17px}
  .ship-card{top:48px;left:max(7px,env(safe-area-inset-left));width:158px;padding:7px 9px;border-radius:7px;z-index:5;background:#062f3bc7}
  .ship-title{gap:7px}.ship-emblem{width:30px;height:30px;font-size:20px}.ship-title small{font-size:8px;letter-spacing:1px}.ship-title strong{font-size:13px;letter-spacing:1px}.level{display:none}
  .hull-label,.flood-label{font-size:8px;margin:5px 0 3px}.bar{height:5px}.ship-stats{gap:6px;margin-top:6px;padding-top:5px;font-size:8px}.ship-stats b{font-size:10px;margin:0 1px}
  .mission{top:48px;left:50%;width:230px;min-width:0;padding:0 6px;pointer-events:none}.mission small{display:none}.mission strong{font-size:13px;margin:2px 0}.mission span{font-size:9px;line-height:1.25}.scenario-tabs,.layout-tools{display:none!important}
  .map-card,.wind,.bottom-center,.focus-panel,.move-hint{display:none!important}
  .controls{left:max(9px,env(safe-area-inset-left));bottom:max(9px,env(safe-area-inset-bottom));z-index:9}
  .defense-pad{width:154px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.defense-pad button,.defense-pad button:first-child,.defense-pad button:last-child{grid-column:auto;min-width:46px;min-height:46px;padding:7px 3px;border-radius:12px;font-size:11px;touch-action:manipulation}
  .actions{right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));gap:5px;z-index:9}.ability{width:60px;height:75px;gap:2px}.ability-icon{width:48px;height:48px;font-size:24px;border-width:2px}.ability strong{font-size:9px;margin-top:1px}.ability small{font-size:7px}.primary{width:78px;height:91px;margin-left:1px}.primary .ability-icon{width:64px;height:64px;font-size:34px}.primary strong{font-size:11px}.reload-meter{width:59px;height:4px}
  #toast{bottom:88px;max-width:54vw;padding:6px 11px;font-size:10px;white-space:normal;text-align:center;z-index:8}
  .debug-panel{top:48px;right:max(7px,env(safe-area-inset-right));width:min(285px,42vw);max-height:calc(100dvh - 118px);font-size:9px;z-index:10}
  .edge-vignette{inset:43px 0 0}
}
@media (orientation:landscape) and (max-height:420px){
  .ship-card{width:145px;padding:5px 7px}.ship-title small,.flood-label{display:none}.ship-emblem{width:26px;height:26px}.hull-label{margin:3px 0 2px}.ship-stats{margin-top:4px;padding-top:3px}
  .mission{width:205px}.mission strong{font-size:11px}.mission span{font-size:8px}
  .defense-pad{width:144px}.defense-pad button,.defense-pad button:first-child,.defense-pad button:last-child{min-width:44px;min-height:44px;font-size:10px}
  .ability{width:55px;height:68px}.ability-icon{width:44px;height:44px}.primary{width:70px;height:84px}.primary .ability-icon{width:58px;height:58px}
}
'''
          css_path.write_text(css, encoding='utf-8')

          readme = root / 'README_操作说明.txt'
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              text += '\n\n【手机横屏围攻版】\n- 本局计划14艘敌船，其中至少10艘为快速运兵小艇。\n- 同时活跃敌船最多5艘，但真实登船入口仍最多2个。外围小艇会等待并在空位出现后补位。\n- 手机横屏时：左下为上舷/中央/下舷预备队调度；右下为舰炮与维修；中央区域尽量不放按钮，方便观察登船。\n- 建议锁定手机横屏游玩，支持安全区/刘海屏边距。\n'
              readme.write_text(text, encoding='utf-8')

          (root / 'game.js').unlink(missing_ok=True)
          PY

          node --check /tmp/latest_guard/guard.js

      - name: Verify mobile swarm build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/latest_guard')
          guard = (root / 'guard.js').read_text(encoding='utf-8')
          css = (root / 'style.css').read_text(encoding='utf-8')
          html = (root / 'index.html').read_text(encoding='utf-8')

          checks = {
              '14 planned enemy craft': 'SWARM_TOTAL=14' in guard,
              'max five active enemy ships': 'MAX_ACTIVE_SHIPS=5' in guard and 'activeThreats()<MAX_ACTIVE_SHIPS' in guard,
              'max two boarding entrances preserved': 'MAX_OPEN=2' in guard,
              'small boats are primary threat': guard.count("type:'skiff'") >= 10,
              'live enemy count HUD': 'enemyCountLive' in html and 'enemyCountLive' in guard,
              'mobile landscape touch layout': 'mobile-landscape-guard' in css and 'orientation:landscape' in css,
              'safe area support': 'safe-area-inset-left' in css and 'safe-area-inset-right' in css,
              'guard-only entry': 'guard.js' in html and 'game.js' not in html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS ' if ok else 'FAIL ') + name)
          if failed:
              raise SystemExit('Acceptance failed: ' + ', '.join(failed))
          PY

          mkdir -p _site/downloads
          cp /tmp/latest_guard/index.html _site/index.html
          cp /tmp/latest_guard/combat.js _site/combat.js
          cp /tmp/latest_guard/guard.js _site/guard.js
          cp /tmp/latest_guard/style.css _site/style.css
          cp /tmp/latest_guard/favicon.svg _site/favicon.svg
          cp /tmp/latest_guard/README_操作说明.txt _site/README_操作说明.txt
          touch _site/.nojekyll

          (cd /tmp/latest_guard && zip -q /tmp/latest_deck_guard_demo.zip index.html combat.js guard.js style.css favicon.svg README_操作说明.txt)
          cp /tmp/latest_deck_guard_demo.zip _site/downloads/latest_deck_guard_demo.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync latest demo to repository root
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout -B main origin/main

          cp /tmp/latest_guard/index.html ./index.html
          cp /tmp/latest_guard/combat.js ./combat.js
          cp /tmp/latest_guard/guard.js ./guard.js
          cp /tmp/latest_guard/style.css ./style.css
          cp /tmp/latest_guard/favicon.svg ./favicon.svg
          cp /tmp/latest_guard/README_操作说明.txt ./README_操作说明.txt
          rm -f legacy_v7.html game.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html combat.js guard.js style.css favicon.svg README_操作说明.txt legacy_v7.html game.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: mobile landscape swarm deck guard"
            git push origin main
          fi
