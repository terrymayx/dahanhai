name: Deploy latest deck guard demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/mobile_swarm_patch.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch latest demo
        run: python scripts/mobile_swarm_patch.py

      - name: Check JavaScript syntax
        run: node --check guard.js

      - name: Verify 10x mass crew build
        run: |
          python - <<'PY'
          from pathlib import Path
          g=Path('guard.js').read_text(encoding='utf-8')
          h=Path('index.html').read_text(encoding='utf-8')
          c=Path('style.css').read_text(encoding='utf-8')
          assert 'ALLIED_SHOOTERS=60' in g
          assert 'ALLIED_DEFENDERS=60' in g
          assert "crew:30,boarders:40" in g
          assert "crew:50,boarders:80" in g
          assert "crew:70,boarders:140" in g
          assert 'ACTIVE_BOARDER_CAP=220' in g
          assert "ship.type==='large'?12:8" in g
          assert 'MAX_OPEN=2' in g
          assert 'MAX_ACTIVE_SHIPS=5' in g
          assert 'SWARM_TOTAL=14' in g
          assert 'deck-guard-mass-crew-10x-2026-09-07' in h
          assert 'mass-crew-10x' in c
          assert 'safe-area-inset-left' in c
          print('10x mass crew acceptance: PASS')
          PY

      - name: Commit latest demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html guard.js style.css README_操作说明.txt
          if ! git diff --cached --quiet; then
            git commit -m "feat: 10x mass crew deck guard"
            git push origin main
          fi

      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/downloads
          cp index.html combat.js guard.js style.css favicon.svg README_操作说明.txt _site/
          touch _site/.nojekyll
          zip -q _site/downloads/latest_deck_guard_demo.zip index.html combat.js guard.js style.css favicon.svg README_操作说明.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
