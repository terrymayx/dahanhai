name: Deploy latest deck guard demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch latest demo
        run: python scripts/mobile_swarm_patch.py

      - name: Check JavaScript syntax
        run: node --check guard.js

      - name: Verify mobile swarm build
        run: |
          python -c "from pathlib import Path; g=Path('guard.js').read_text(); h=Path('index.html').read_text(); c=Path('style.css').read_text(); assert 'SWARM_TOTAL=14' in g; assert g.count(\"type:'skiff'\") >= 11; assert 'MAX_ACTIVE_SHIPS=5' in g; assert 'MAX_OPEN=2' in g; assert 'enemyCountLive' in h and 'enemyCountLive' in g; assert 'mobile-landscape-guard' in c; assert 'safe-area-inset-left' in c; print('mobile swarm acceptance: PASS')"

      - name: Commit latest demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html guard.js style.css README_操作说明.txt
          if ! git diff --cached --quiet; then
            git commit -m "feat: more skiffs and mobile landscape guard"
            git push origin main
          fi

      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/downloads
          cp index.html combat.js guard.js style.css favicon.svg README_操作说明.txt _site/
          touch _site/.nojekyll
          zip -q _site/downloads/latest_deck_guard_demo.zip index.html combat.js guard.js style.css favicon.svg README_操作说明.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
