name: Deploy latest deck guard demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/mobile_swarm_patch.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply one-time paced approach migration
        run: python scripts/mobile_swarm_patch.py

      - name: Verify current deck guard
        run: |
          node --check combat.js
          node --check guard.js
          node tests/deck_guard_approach.test.js
          python - <<'PY'
          from pathlib import Path
          g=Path('guard.js').read_text(encoding='utf-8')
          h=Path('index.html').read_text(encoding='utf-8')
          assert 'ALLIED_SHOOTERS=60' in g
          assert 'ALLIED_DEFENDERS=60' in g
          assert 'MAX_OPEN=2' in g and 'MAX_ACTIVE_SHIPS=5' in g
          assert 'C.guardApproachSpeed(ship.type,d)' in g
          assert 'function updateEnemyCrewMotion(' in g
          assert 'deck-guard-ranged-approach-2026-09-07' in h
          print('paced deck guard acceptance: PASS')
          PY

      - name: Commit migrated source once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html guard.js README_操作说明.txt
          if ! git diff --cached --quiet; then
            git commit -m "feat: paced ranged approach and moving deck crew"
            git push origin main
          fi

      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/downloads
          cp index.html combat.js guard.js style.css favicon.svg README_操作说明.txt _site/
          touch _site/.nojekyll
          zip -q _site/downloads/latest_deck_guard_demo.zip index.html combat.js guard.js style.css favicon.svg README_操作说明.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
