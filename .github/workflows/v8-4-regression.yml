name: V8.4 Physics Feel Regression
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V8.4 RED GREEN
        shell: bash
        run: |
          node tests/v8_4_ship_impulse.test.js
          node tests/v8_4_ballistic_feel.test.js
          node tests/v8_4_feedback_levels.test.js
          node tests/v8_4_debris_water.test.js
          node tests/v8_4_render_contract.test.js
