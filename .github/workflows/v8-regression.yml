name: V8 Regression
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V8 ShipGrid + Projectile
        run: node tests/v8_0_ship_grid.test.js
      - name: V8 Battle
        run: node tests/v8_0_battle.test.js
