name: V7.1 Boarding Flow
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done
      - name: Run V7.1 regression
        run: node tests/v7_1_boarding_flow_no_jitter.test.js
