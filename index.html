<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>大航海时代 V2.0 - 登船战强化版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061822;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#fff}#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#061822}#game{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:#0878a8;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 2px 3px #000}.tl{position:absolute;left:1.5%;top:1.7%;width:25%;font-weight:900;font-size:clamp(11px,1.1vw,18px)}.bar{height:17px;border:3px solid #172631;border-radius:10px;background:#172631cc;overflow:hidden;margin:3px 0 6px}.bar i{display:block;height:100%;background:#dc4336}.bar.blue i{background:#2dbadf}.tc{position:absolute;left:50%;top:1.5%;transform:translateX(-50%);text-align:center;font-weight:900}.wave{padding:5px 18px;border:3px solid #a87940;border-radius:10px;background:#4c301add;font-size:clamp(14px,1.7vw,27px)}.phase{margin-top:5px;padding:4px 10px;border-radius:8px;background:#092634dd;font-size:clamp(10px,1vw,16px)}.tr{position:absolute;right:1.5%;top:1.5%;display:flex;gap:7px}.icon{pointer-events:auto;width:50px;height:50px;border:3px solid #14242e;border-radius:11px;background:#294250dd;color:white;font-size:21px;font-weight:900}.skills{position:absolute;left:1.8%;bottom:2.5%;display:flex;gap:1vw;pointer-events:auto}.skill{width:clamp(58px,6.2vw,94px);height:clamp(58px,6.2vw,94px);border-radius:50%;border:4px solid #26323a;background:radial-gradient(circle at 35% 25%,#61727b,#17252c 70%);color:#fff;font-size:clamp(22px,2.5vw,38px);font-weight:900;position:relative}.skill span{position:absolute;left:50%;bottom:-23px;transform:translateX(-50%);font-size:clamp(9px,.9vw,14px);white-space:nowrap}.skill.cool:after{content:attr(data-cd);position:absolute;inset:0;border-radius:50%;background:#07131cbb;display:flex;align-items:center;justify-content:center;font-size:27px}.skill.on{outline:4px solid #52e681}.msg{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-size:clamp(18px,2.2vw,34px);font-weight:1000;color:#ffe46b;opacity:0;transition:.18s}.msg.show{opacity:1}.tip{position:absolute;right:1.5%;bottom:2%;font-size:clamp(9px,.85vw,13px);background:#02172299;padding:6px 10px;border-radius:8px}.result{position:absolute;inset:0;background:#00131ddd;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:auto;text-align:center}.result.show{display:flex}.result h1{font-size:clamp(36px,5vw,72px);margin:0 0 10px}.result button{border:0;border-radius:12px;padding:11px 28px;background:#efb33c;font-size:21px;font-weight:900}@media(max-height:520px){.skill span,.tip{display:none}.icon{width:42px;height:42px}.bar{height:14px}}
</style>
</head>
<body><div id="wrap"><div id="game"><canvas id="c" width="1600" height="900"></canvas><div class="hud">
<div class="tl">旗舰耐久 <b id="hpText">1500/1500</b><div class="bar"><i id="hpBar"></i></div>甲板士气 <b id="morText">100</b><div class="bar blue"><i id="morBar"></i></div></div>
<div class="tc"><div class="wave">第 <span id="waveText">1</span>/8 波</div><div class="phase" id="phaseText">海盗舰队来袭</div></div>
<div class="tr"><button class="icon" id="pauseBtn">Ⅱ</button><button class="icon" id="speedBtn">×1</button></div>
<div class="skills"><button class="skill on" id="autoBtn">⚙<span>自动炮击</span></button><button class="skill" id="cannonBtn">💥<span>大炮齐射</span></button><button class="skill" id="arrowBtn">🏹<span>箭雨</span></button><button class="skill" id="repelBtn">⚔️<span>甲板反击</span></button><button class="skill" id="healBtn">➕<span>紧急维修</span></button></div>
<div class="msg" id="msg"></div><div class="tip">敌船统一向左；靠船后搭板登船。点击敌船可集中火力。</div>
<div class="result" id="result"><h1 id="resultTitle">胜利</h1><p id="resultText"></p><button id="restartBtn">重新开始</button></div></div></div></div>
<script>
(()=>{
const C=document.getElementById('c'),X=C.getContext('2d'),W=1600,H=900,$=id=>document.getElementById(id);
const ui={hp:$('hpText'),hpb:$('hpBar'),mor:$('morText'),morb:$('morBar'),wave:$('waveText'),phase:$('phaseText'),msg:$('msg'),result:$('result'),title:$('resultTitle'),text:$('resultText')};
let last=0,paused=false,speed=1,gameOver=false,wave=1,spawn=[],spawnT=0,nextWave=1,shake=0,focus=null,auto=true;
const enemies=[],balls=[],arrows=[],pirates=[],fx=[],planks=[];
const cd={cannon:0,arrow:0,repel:0,heal:0},cdm={cannon:5,arrow:7,repel:10,heal:12};
const ship={x:80,y:90,w:305,h:720,hp:1500,max:1500,morale:100,autoC:0,autoA:0,cannons:[300,405,510,615],crew:[]};
const spots=[[190,230,'archer'],[285,270,'gunner'],[195,350,'sword'],[292,390,'sword'],[188,470,'archer'],[292,520,'sword'],[195,600,'sword'],[292,650,'medic'],[220,710,'captain']];
spots.forEach((s,i)=>ship.crew.push({x:s[0],y:s[1],hx:s[0],hy:s[1],role:s[2],hp:100,alive:true,cd:Math.random(),buff:0,atk:s[2]==='captain'?18:s[2]==='sword'?16:13}));
const types={skiff:{name:'突击小艇',w:105,h:60,hp:80,sp:70,b:2,s:'#15191c'},pirate:{name:'海盗帆船',w:138,h:78,hp:145,sp:50,b:4,s:'#17191c'},boarder:{name:'登船船',w:165,h:92,hp:235,sp:41,b:6,s:'#7f2522'},fire:{name:'火攻船',w:112,h:64,hp:70,sp:82,b:0,s:'#a53b22'}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function msg(t){ui.msg.textContent=t;ui.msg.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>ui.msg.classList.remove('show'),850)}
function burst(x,y,n=12,col='#ffbd4a'){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*230,vy:(Math.random()-.5)*230,r:2+Math.random()*4,life:.4+Math.random()*.5,col})}
function reset(){last=0;paused=false;speed=1;gameOver=false;wave=1;nextWave=1;shake=0;focus=null;auto=true;enemies.length=balls.length=arrows.length=pirates.length=fx.length=planks.length=0;ship.hp=1500;ship.morale=100;ship.autoC=.3;ship.autoA=.8;ship.crew.forEach((c,i)=>{c.x=spots[i][0];c.y=spots[i][1];c.hp=100;c.alive=true;c.buff=0;c.cd=Math.random()});Object.keys(cd).forEach(k=>cd[k]=0);$('autoBtn').classList.add('on');ui.result.classList.remove('show');startWave();hud()}
function startWave(){const pool=wave<3?['skiff','skiff','pirate']:wave<5?['skiff','pirate','pirate','boarder']:['skiff','pirate','boarder','boarder','fire'];spawn=[];for(let i=0;i<Math.min(7+wave*2,22);i++)spawn.push(pool[(Math.random()*pool.length)|0]);spawnT=.25;ui.wave.textContent=wave;msg('第 '+wave+' 波！海盗船潮来袭')}
function addEnemy(k){const t=types[k],y=150+Math.random()*610;const e={type:k,t,x:W+70+Math.random()*190,y,w:t.w,h:t.h,hp:t.hp*(1+wave*.075),max:0,sp:t.sp*(.92+Math.random()*.16),state:'sail',dead:false,hit:0,board:t.b,bt:0,sink:0,ang:0};e.max=e.hp;enemies.push(e)}
function nearestEnemy(){let b=null,d=1e9;for(const e of enemies)if(!e.dead&&e.state!=='sink'&&e.x<d){d=e.x;b=e}return b}
function fireCannon(power=42,manual=false){const target=focus&&!focus.dead?focus:nearestEnemy();ship.cannons.forEach(y=>{const sx=385,sy=y,tx=target?target.x:1250,ty=target?target.y:sy,dx=tx-sx,dy=ty-sy,l=Math.hypot(dx,dy)||1,s=630;balls.push({x:sx,y:sy,vx:dx/l*s,vy:dy/l*s+(Math.random()-.5)*(manual?55:25),dmg:power,life:3})});shake=Math.max(shake,manual?8:4)}
function fireArrows(n=5,p=13){const shooters=ship.crew.filter(c=>c.alive&&(c.role==='archer'||c.role==='captain'));if(!shooters.length)return;for(let i=0;i<n;i++){const s=shooters[i%shooters.length],t=focus&&!focus.dead?focus:nearestEnemy();if(!t)continue;const dx=t.x-s.x,dy=t.y-s.y,l=Math.hypot(dx,dy)||1;arrows.push({x:s.x,y:s.y,vx:dx/l*500,vy:dy/l*500,dmg:p,life:2,shipShot:true})}}
function board(e){if(e.state==='board')return;e.state='board';e.x=445;e.y=clamp(e.y,210,700);e.sp=0;planks.push({e,y:e.y});e.bt=.1;ui.phase.textContent='近战阶段：守住甲板！';msg('搭板完成！海盗登船！')}
function spawnPirate(e){if(e.board<=0)return;e.board--;pirates.push({x:e.x-35,y:e.y+(Math.random()-.5)*55,tx:355-Math.random()*140,ty:190+Math.random()*520,hp:70+wave*6,max:70+wave*6,atk:8+wave*.7,cd:.3,phase:'cross',src:e,dead:false})}
function killEnemy(e){if(e.dead)return;e.dead=true;e.state='sink';e.sink=0;e.sp=0;burst(e.x,e.y,25);shake=11;if(focus===e)focus=null;for(let i=planks.length-1;i>=0;i--)if(planks[i].e===e)planks.splice(i,1)}
function hit(x,y,e){return x>e.x-e.w*.5&&x<e.x+e.w*.5&&y>e.y-e.h*.5&&y<e.y+e.h*.5}
function nearCrew(p){let b=null,d=1e9;for(const c of ship.crew){if(!c.alive)continue;const q=(c.x-p.x)**2+(c.y-p.y)**2;if(q<d){d=q;b=c}}return b}
function nearPirate(c){let b=null,d=1e9;for(const p of pirates){if(p.dead)continue;const q=(p.x-c.x)**2+(p.y-c.y)**2;if(q<d){d=q;b=p}}return b}
function update(dt){if(paused||gameOver)return;dt*=speed;Object.keys(cd).forEach(k=>cd[k]=Math.max(0,cd[k]-dt));skillUI();
if(spawn.length){spawnT-=dt;if(spawnT<=0){const n=Math.random()<.35?Math.min(3,spawn.length):1;for(let i=0;i<n;i++)addEnemy(spawn.shift());spawnT=.35+Math.random()*.7}}else if(!enemies.length&&!pirates.length){nextWave-=dt;if(nextWave<=0){wave++;if(wave>8)return win();nextWave=1.6;startWave()}}
ship.autoC-=dt;ship.autoA-=dt;if(auto&&ship.autoC<=0){fireCannon();ship.autoC=1.2}if(ship.autoA<=0){fireArrows();ship.autoA=1.8}
for(const e of enemies){e.hit=Math.max(0,e.hit-dt);if(e.state==='sail'){e.x-=e.sp*dt;if(e.x<650){e.state='approach';e.sp*=.58}}else if(e.state==='approach'){e.x-=e.sp*dt;if(e.type==='fire'&&e.x<505){ship.hp-=125+wave*7;burst(e.x,e.y,35,'#ff6b28');killEnemy(e);continue}if(e.x<510){e.state='hook';e.hook=.8;msg(e.t.name+' 正在抛钩！')}}else if(e.state==='hook'){e.hook-=dt;if(e.hook<=0)board(e)}else if(e.state==='board'){e.bt-=dt;if(e.board>0&&e.bt<=0){spawnPirate(e);e.bt=.38+Math.random()*.22}if(e.board<=0&&!pirates.some(p=>!p.dead&&p.src===e)){e.state='retreat';e.sp=55;for(let i=planks.length-1;i>=0;i--)if(planks[i].e===e)planks.splice(i,1)}}else if(e.state==='retreat'){e.x+=e.sp*dt;if(e.x>W+100)e.dead=true}else if(e.state==='sink'){e.sink+=dt;e.ang+=dt*.18;e.y+=12*dt}}
for(const b of balls){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const e of enemies){if(e.dead||e.state==='sink'||b.life<=0)continue;if(hit(b.x,b.y,e)){e.hp-=b.dmg;e.hit=.12;b.life=0;burst(b.x,b.y,9);if(e.hp<=0)killEnemy(e);break}}}
for(const a of arrows){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;if(a.shipShot){for(const e of enemies){if(e.dead||e.state==='sink'||a.life<=0)continue;if(hit(a.x,a.y,e)){e.hp-=a.dmg;a.life=0;if(e.hp<=0)killEnemy(e);break}}}else{for(const p of pirates){if(p.dead||a.life<=0)continue;if(Math.hypot(a.x-p.x,a.y-p.y)<18){p.hp-=a.dmg;a.life=0;if(p.hp<=0)p.dead=true;break}}}}
for(const p of pirates){if(p.dead)continue;if(p.phase==='cross'){let dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*80*dt;p.y+=dy/d*80*dt;if(d<15)p.phase='fight'}else{p.cd-=dt;const c=nearCrew(p);if(c){let dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy)||1;if(d>34){p.x+=dx/d*55*dt;p.y+=dy/d*55*dt}else if(p.cd<=0){c.hp-=p.atk;p.cd=.8;if(c.hp<=0){c.alive=false;ship.morale=Math.max(0,ship.morale-9)}}}else ship.hp-=p.atk*.35*dt}}
for(const c of ship.crew){if(!c.alive)continue;c.cd-=dt;c.buff=Math.max(0,c.buff-dt);const p=nearPirate(c);if(c.role==='sword'||c.role==='captain'){if(p){let dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy)||1;if(d>36&&d<230){c.x+=dx/d*78*dt;c.y+=dy/d*78*dt}else if(d<=42&&c.cd<=0){p.hp-=c.atk*(c.buff>0?1.8:1);c.cd=c.buff>0?.38:.62;if(p.hp<=0)p.dead=true}}else{let dx=c.hx-c.x,dy=c.hy-c.y,d=Math.hypot(dx,dy)||1;if(d>4){c.x+=dx/d*45*dt;c.y+=dy/d*45*dt}}}else if(c.role==='archer'&&p&&c.cd<=0){let dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy)||1;arrows.push({x:c.x,y:c.y,vx:dx/d*390,vy:dy/d*390,dmg:13,life:1.2,shipShot:false});c.cd=.9}else if(c.role==='medic'&&c.cd<=0){const w=ship.crew.filter(q=>q.alive&&q.hp<100).sort((a,b)=>a.hp-b.hp)[0];if(w){w.hp=Math.min(100,w.hp+9);c.cd=1.3}}}
for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.95;f.vy*=.95;f.life-=dt}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if((e.state==='sink'&&e.sink>2)||(e.dead&&e.state!=='sink'))enemies.splice(i,1)}for(let i=balls.length-1;i>=0;i--)if(balls[i].life<=0||balls[i].x>W+50)balls.splice(i,1);for(let i=arrows.length-1;i>=0;i--)if(arrows[i].life<=0)arrows.splice(i,1);for(let i=pirates.length-1;i>=0;i--)if(pirates[i].dead)pirates.splice(i,1);for(let i=fx.length-1;i>=0;i--)if(fx[i].life<=0)fx.splice(i,1);
ui.phase.textContent=pirates.length?'近战阶段：甲板上 '+pirates.length+' 名海盗':'海盗舰队来袭';if(ship.hp<=0||ship.morale<=0)lose();hud();shake*=.86}
function hud(){ui.hp.textContent=Math.max(0,ship.hp|0)+'/1500';ui.hpb.style.width=clamp(ship.hp/15,0,100)+'%';ui.mor.textContent=ship.morale|0;ui.morb.style.width=clamp(ship.morale,0,100)+'%'}
function skillUI(){[['cannonBtn','cannon'],['arrowBtn','arrow'],['repelBtn','repel'],['healBtn','heal']].forEach(([id,k])=>{const b=$(id);if(cd[k]>0){b.classList.add('cool');b.dataset.cd=Math.ceil(cd[k])}else b.classList.remove('cool')})}
function win(){gameOver=true;ui.title.textContent='胜利！';ui.text.textContent='你成功守住了 8 波海盗舰队。';ui.result.classList.add('show')}function lose(){gameOver=true;ui.title.textContent='旗舰失守';ui.text.textContent='海盗突破了甲板防线。';ui.result.classList.add('show')}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);X.fill()}
function sea(){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1597c9');g.addColorStop(1,'#075b87');X.fillStyle=g;X.fillRect(0,0,W,H);X.globalAlpha=.2;X.strokeStyle='#d8faff';X.lineWidth=2;for(let y=80;y<H;y+=58)for(let x=y%115;x<W;x+=115){X.beginPath();X.arc(x,y,23,3.45,5.9);X.stroke()}X.globalAlpha=1}
function crew(c){X.save();X.translate(c.x,c.y);if(!c.alive){X.globalAlpha=.25;X.rotate(1)}X.fillStyle=c.role==='medic'?'#eee':c.role==='captain'?'#ba8b2b':'#246ba3';X.fillRect(-10,-6,20,27);X.fillStyle='#e8b478';X.beginPath();X.arc(0,-16,10,0,Math.PI*2);X.fill();X.fillStyle='#153e68';X.fillRect(-11,-27,22,7);X.strokeStyle='#201713';X.lineWidth=3;if(c.role==='archer'){X.beginPath();X.arc(16,-3,11,-1.4,1.4);X.stroke()}else if(c.role==='sword'||c.role==='captain'){X.beginPath();X.moveTo(10,-2);X.lineTo(27,-20);X.stroke()}X.restore()}
function player(){X.fillStyle='#4d2a18';rr(ship.x,ship.y,ship.w,ship.h,82);X.fillStyle='#a97039';rr(ship.x+16,ship.y+16,ship.w-32,ship.h-32,70);X.fillStyle='#cf9c5a';rr(ship.x+35,ship.y+32,ship.w-70,ship.h-64,56);X.strokeStyle='#694126';X.lineWidth=5;for(let y=190;y<760;y+=48){X.beginPath();X.moveTo(120,y);X.lineTo(345,y);X.stroke()}ship.cannons.forEach(y=>{X.fillStyle='#1b2328';X.fillRect(328,y-9,68,27);X.fillStyle='#0b1114';X.beginPath();X.arc(396,y+4,14,0,Math.PI*2);X.fill()});ship.crew.forEach(crew)}
function enemy(e){X.save();X.translate(e.x,e.y);X.rotate(e.ang);if(e.state==='sink')X.globalAlpha=clamp(1-e.sink/2,0,1);X.fillStyle='#63381e';X.beginPath();X.moveTo(-e.w*.5,-e.h*.23);X.quadraticCurveTo(0,-e.h*.52,e.w*.48,-e.h*.23);X.lineTo(e.w*.34,e.h*.4);X.quadraticCurveTo(0,e.h*.55,-e.w*.48,e.h*.3);X.closePath();X.fill();X.fillStyle='#9b6332';X.fillRect(-e.w*.34,-e.h*.16,e.w*.64,e.h*.38);X.strokeStyle='#71431f';X.lineWidth=5;X.beginPath();X.moveTo(-e.w*.14,-e.h*.42);X.lineTo(-e.w*.14,e.h*.15);X.stroke();X.fillStyle=e.t.s;X.beginPath();X.moveTo(-e.w*.13,-e.h*.38);X.lineTo(e.w*.24,-e.h*.29);X.lineTo(e.w*.18,e.h*.05);X.lineTo(-e.w*.13,0);X.closePath();X.fill();X.fillStyle='#fff';X.font='bold 18px sans-serif';X.fillText(e.type==='fire'?'🔥':'☠',-5,-8);X.fillStyle='#111';X.fillRect(-e.w*.34,-e.h*.58,e.w*.68,7);X.fillStyle='#e34235';X.fillRect(-e.w*.34,-e.h*.58,e.w*.68*clamp(e.hp/e.max,0,1),7);if(e.hit){X.globalAlpha=.35;X.fillStyle='#fff';X.fillRect(-e.w*.5,-e.h*.5,e.w,e.h)}X.restore()}
function draw(){X.save();X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);sea();player();planks.forEach(p=>{X.strokeStyle='#5d391f';X.lineWidth=18;X.beginPath();X.moveTo(395,p.y);X.lineTo(p.e.x-45,p.y);X.stroke()});enemies.forEach(enemy);for(const b of balls){X.fillStyle='#14191c';X.beginPath();X.arc(b.x,b.y,10,0,Math.PI*2);X.fill()}for(const a of arrows){X.strokeStyle='#663718';X.lineWidth=3;X.beginPath();X.moveTo(a.x-15,a.y);X.lineTo(a.x+7,a.y);X.stroke()}for(const p of pirates){X.fillStyle='#a9322a';X.fillRect(p.x-10,p.y-5,20,26);X.fillStyle='#e3ad72';X.beginPath();X.arc(p.x,p.y-15,9,0,Math.PI*2);X.fill()}for(const f of fx){X.globalAlpha=clamp(f.life/.8,0,1);X.fillStyle=f.col;X.beginPath();X.arc(f.x,f.y,f.r,0,Math.PI*2);X.fill()}X.globalAlpha=1;if(focus&&!focus.dead){X.strokeStyle='#ffe04b';X.lineWidth=4;X.setLineDash([10,8]);X.beginPath();X.ellipse(focus.x,focus.y,focus.w*.62,focus.h*.7,0,0,Math.PI*2);X.stroke();X.setLineDash([])}X.restore()}
function frame(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}
$('autoBtn').onclick=()=>{auto=!auto;$('autoBtn').classList.toggle('on',auto);msg(auto?'自动炮击：开启':'自动炮击：关闭')};$('cannonBtn').onclick=()=>{if(cd.cannon<=0){fireCannon(105,true);cd.cannon=cdm.cannon;msg('大炮齐射！')}};$('arrowBtn').onclick=()=>{if(cd.arrow<=0){fireArrows(24,35);cd.arrow=cdm.arrow;msg('箭雨覆盖！')}};$('repelBtn').onclick=()=>{if(cd.repel<=0){let n=0;ship.crew.forEach(c=>{if(c.alive&&c.role==='sword')c.buff=4});pirates.forEach(p=>{p.hp-=55;n++;if(p.hp<=0)p.dead=true});cd.repel=cdm.repel;msg(n?'甲板反击！':'暂无登船敌人')}};$('healBtn').onclick=()=>{if(cd.heal<=0){ship.hp=Math.min(1500,ship.hp+190);ship.crew.forEach(c=>{if(c.alive)c.hp=Math.min(100,c.hp+45)});ship.morale=Math.min(100,ship.morale+15);cd.heal=cdm.heal;msg('紧急维修 +190')}};$('pauseBtn').onclick=()=>{paused=!paused;$('pauseBtn').textContent=paused?'▶':'Ⅱ'};$('speedBtn').onclick=()=>{speed=speed===1?1.5:speed===1.5?2:1;$('speedBtn').textContent='×'+speed};$('restartBtn').onclick=reset;
C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;focus=null;for(const q of enemies)if(!q.dead&&hit(x,y,q)){focus=q;msg('集中火力：'+q.t.name);break}});
reset();requestAnimationFrame(frame);
})();
</script></body></html>
