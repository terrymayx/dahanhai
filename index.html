<!doctype html>

<title>大航海时代 V3.0 - 甲板攻防版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061822;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#fff}#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#14394b,#061822 70%)}#game{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:#0878a8;box-shadow:0 0 50px #000a;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}.tl{position:absolute;left:1.4%;top:1.5%;width:24%;font-weight:900;font-size:clamp(11px,1.05vw,17px)}.bar{height:17px;border:3px solid #172631;border-radius:10px;background:#172631cc;overflow:hidden;margin:3px 0 6px}.bar i{display:block;height:100%;background:linear-gradient(#ff6550,#c52f27)}.bar.blue i{background:linear-gradient(#66e4ff,#168ed7)}.tc{position:absolute;left:50%;top:1.4%;transform:translateX(-50%);text-align:center;font-weight:1000}.wave{padding:5px 18px;border:3px solid #a87940;border-radius:10px;background:#4c301add;font-size:clamp(14px,1.7vw,27px)}.phase{margin-top:5px;padding:4px 10px;border-radius:8px;background:#092634dd;font-size:clamp(10px,1vw,16px)}.tr{position:absolute;right:1.4%;top:1.4%;display:flex;gap:7px}.icon{pointer-events:auto;width:50px;height:50px;border:3px solid #14242e;border-radius:11px;background:#294250e8;color:white;font-size:21px;font-weight:900;cursor:pointer}.zones{position:absolute;right:1.5%;top:18%;width:clamp(150px,16vw,255px);display:grid;gap:7px}.zone{padding:7px 9px;background:#0b2431d9;border:2px solid #456574;border-radius:9px;font-size:clamp(10px,.9vw,14px);font-weight:900}.zoneHead{display:flex;justify-content:space-between;gap:8px}.zoneTrack{height:8px;margin-top:5px;background:#10222b;border-radius:10px;overflow:hidden}.zoneTrack i{display:block;height:100%;width:0%;background:#54d57a}.zone.warn{border-color:#e1a93c}.zone.warn .zoneTrack i{background:#e6b43f}.zone.danger{border-color:#f05a45;box-shadow:0 0 14px #ff4b3f66}.zone.danger .zoneTrack i{background:#ef4d3f}.skills{position:absolute;left:1.8%;bottom:2.6%;display:flex;gap:1vw;pointer-events:auto}.skill{width:clamp(58px,6.2vw,94px);height:clamp(58px,6.2vw,94px);border-radius:50%;border:4px solid #26323a;background:radial-gradient(circle at 35% 25%,#61727b,#17252c 70%);color:#fff;font-size:clamp(22px,2.5vw,38px);font-weight:900;position:relative;cursor:pointer}.skill span{position:absolute;left:50%;bottom:-23px;transform:translateX(-50%);font-size:clamp(9px,.9vw,14px);white-space:nowrap}.skill.cool:after{content:attr(data-cd);position:absolute;inset:0;border-radius:50%;background:#07131cbb;display:flex;align-items:center;justify-content:center;font-size:27px}.skill.on{outline:4px solid #52e681}.msg{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-size:clamp(18px,2.2vw,34px);font-weight:1000;color:#ffe46b;opacity:0;transition:.18s;white-space:nowrap}.msg.show{opacity:1}.combo{position:absolute;right:2%;bottom:17%;font-size:clamp(15px,2vw,30px);font-weight:1000;color:#ffd44d;opacity:0}.combo.show{opacity:1}.tip{position:absolute;right:1.5%;bottom:2%;font-size:clamp(9px,.85vw,13px);background:#02172299;padding:6px 10px;border-radius:8px}.result{position:absolute;inset:0;background:#00131ddd;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:auto;text-align:center}.result.show{display:flex}.result h1{font-size:clamp(36px,5vw,72px);margin:0 0 10px}.result p{max-width:70%;font-size:clamp(14px,1.4vw,21px)}.result button{border:0;border-radius:12px;padding:11px 28px;background:#efb33c;font-size:21px;font-weight:900}@media(max-height:520px){.skill span,.tip{display:none}.icon{width:42px;height:42px}.bar{height:14px}.zones{top:16%;width:145px}.zone{padding:4px 6px}}
</style>
</head>
<body>
<div id="wrap"><div id="game"><canvas id="c" width="1600" height="900"></canvas><div class="hud">
<div class="tl">旗舰耐久 <b id="hpText">1600/1600</b><div class="bar"><i id="hpBar"></i></div>甲板士气 <b id="morText">100</b><div class="bar blue"><i id="morBar"></i></div></div>
<div class="tc"><div class="wave">第 <span id="waveText">1</span>/8 波</div><div class="phase" id="phaseText">海盗舰队来袭</div></div>
<div class="tr"><button class="icon" id="pauseBtn">Ⅱ</button><button class="icon" id="speedBtn">×1</button></div>
<div class="zones"><div class="zone" id="zone-upper"><div class="zoneHead"><span>上甲板</span><span id="zone-upper-text">安全</span></div><div class="zoneTrack"><i id="zone-upper-bar"></i></div></div><div class="zone" id="zone-mid"><div class="zoneHead"><span>中甲板</span><span id="zone-mid-text">安全</span></div><div class="zoneTrack"><i id="zone-mid-bar"></i></div></div><div class="zone" id="zone-lower"><div class="zoneHead"><span>下甲板</span><span id="zone-lower-text">安全</span></div><div class="zoneTrack"><i id="zone-lower-bar"></i></div></div></div>
<div class="skills"><button class="skill on" id="autoBtn">⚙<span>自动炮击</span></button><button class="skill" id="cannonBtn">💥<span>大炮齐射</span></button><button class="skill" id="arrowBtn">🏹<span>箭雨</span></button><button class="skill" id="repelBtn">⚔️<span>甲板反击</span></button><button class="skill" id="healBtn">➕<span>紧急维修</span></button></div>
<div class="msg" id="msg"></div><div class="combo" id="combo"></div><div class="tip">敌船只朝左。点敌船集火；火攻船优先击沉，重甲船抗炮更强。</div><div class="result" id="result"><h1 id="resultTitle">胜利</h1><p id="resultText"></p><button id="restartBtn">重新开始</button></div>
</div></div></div>
<script>
(()=>{
const C=document.getElementById('c'),X=C.getContext('2d'),W=1600,H=900,$=id=>document.getElementById(id);const ui={hp:$('hpText'),hpb:$('hpBar'),mor:$('morText'),morb:$('morBar'),wave:$('waveText'),phase:$('phaseText'),msg:$('msg'),combo:$('combo'),result:$('result'),title:$('resultTitle'),text:$('resultText')};
const ZONES={upper:{key:'upper',label:'上甲板',y:255,spawnY:[185,315],pressure:0,breach:0},mid:{key:'mid',label:'中甲板',y:455,spawnY:[365,545],pressure:0,breach:0},lower:{key:'lower',label:'下甲板',y:655,spawnY:[585,735],pressure:0,breach:0}},zoneKeys=['upper','mid','lower'];
let last=0,paused=false,speed=1,gameOver=false,wave=1,spawn=[],spawnT=0,nextWave=1,shake=0,focus=null,auto=true,combo=0,comboT=0,enemySeq=0;const enemies=[],balls=[],arrows=[],pirates=[],fx=[],planks=[],smokes=[],texts=[];const cd={cannon:0,arrow:0,repel:0,heal:0},cdm={cannon:5,arrow:7,repel:10,heal:12};
const ship={x:72,y:82,w:320,h:736,hp:1600,max:1600,morale:100,autoC:0,autoA:0,cannons:[280,390,500,610],crew:[]};const spots=[[185,215,'archer','upper'],[282,255,'sword','upper'],[205,325,'sword','upper'],[185,405,'archer','mid'],[286,448,'sword','mid'],[205,520,'captain','mid'],[182,610,'archer','lower'],[286,650,'sword','lower'],[214,710,'medic','lower']];spots.forEach((s,i)=>ship.crew.push({id:i,x:s[0],y:s[1],hx:s[0],hy:s[1],role:s[2],zone:s[3],hp:100,max:100,alive:true,cd:Math.random(),buff:0,atk:s[2]==='captain'?19:s[2]==='sword'?17:s[2]==='archer'?13:8}));
const types={skiff:{name:'突击小艇',w:105,h:60,hp:82,sp:74,b:2,s:'#15191c',armor:0,score:1},pirate:{name:'海盗帆船',w:138,h:78,hp:150,sp:52,b:4,s:'#17191c',armor:.05,score:2},boarder:{name:'登船船',w:165,h:92,hp:245,sp:42,b:6,s:'#7f2522',armor:.08,score:3},fire:{name:'火攻船',w:112,h:64,hp:75,sp:86,b:0,s:'#a53b22',armor:0,score:2},armored:{name:'重甲船',w:178,h:98,hp:360,sp:35,b:5,s:'#4c4f58',armor:.38,score:4}};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function zoneForY(y){return y<355?'upper':y<565?'mid':'lower'}function zoneStatus(p){return p>=85?'失守':p>=55?'告急':'安全'}
function msg(t){ui.msg.textContent=t;ui.msg.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>ui.msg.classList.remove('show'),850)}function burst(x,y,n=12,col='#ffbd4a',force=230){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*force,vy:(Math.random()-.5)*force,r:2+Math.random()*4,life:.4+Math.random()*.5,col})}function smoke(x,y,n=5){for(let i=0;i<n;i++)smokes.push({x:x+(Math.random()-.5)*18,y:y+(Math.random()-.5)*18,vx:(Math.random()-.5)*18,vy:-18-Math.random()*20,r:9+Math.random()*10,life:.9+Math.random()*.8})}function pop(x,y,t,col='#fff'){texts.push({x,y,t,col,life:.9})}
function reset(){last=0;paused=false;speed=1;gameOver=false;wave=1;nextWave=1;shake=0;focus=null;auto=true;combo=0;comboT=0;enemySeq=0;enemies.length=balls.length=arrows.length=pirates.length=fx.length=planks.length=smokes.length=texts.length=0;ship.hp=1600;ship.morale=100;ship.autoC=.3;ship.autoA=.8;ship.crew.forEach((c,i)=>{c.x=spots[i][0];c.y=spots[i][1];c.hp=100;c.alive=true;c.buff=0;c.cd=Math.random();c.zone=spots[i][3]});zoneKeys.forEach(k=>{ZONES[k].pressure=0;ZONES[k].breach=0});Object.keys(cd).forEach(k=>cd[k]=0);$('autoBtn').classList.add('on');ui.result.classList.remove('show');startWave();hud()}
function wavePool(n){if(n<2)return['skiff','skiff','pirate'];if(n<4)return['skiff','pirate','pirate','boarder'];if(n<6)return['skiff','pirate','boarder','fire','armored'];return['skiff','pirate','boarder','boarder','fire','armored','armored']}function startWave(){const pool=wavePool(wave);spawn=[];for(let i=0;i<Math.min(9+wave*2,25);i++)spawn.push(pool[(Math.random()*pool.length)|0]);if(wave===4)spawn.splice(2,0,'fire','fire','boarder');if(wave===7)spawn.splice(1,0,'armored','boarder','fire','armored');spawnT=.22;ui.wave.textContent=wave;msg('第 '+wave+' 波！ 多点船潮压境')}
function addEnemy(k){const t=types[k],zone=zoneKeys[(Math.random()*zoneKeys.length)|0],zr=ZONES[zone],y=clamp(zr.y+(Math.random()-.5)*100,zr.spawnY[0],zr.spawnY[1]);const e={id:++enemySeq,type:k,t,zone,x:W+60+Math.random()*170,y,w:t.w,h:t.h,hp:t.hp*(1+wave*.08),max:0,sp:t.sp*(.92+Math.random()*.16),state:'sail',dead:false,hit:0,board:t.b,bt:0,sink:0,ang:0,recoil:0};e.max=e.hp;enemies.push(e)}
function nearestEnemy(){let b=null,d=1e9;for(const e of enemies){if(e.dead||e.state==='sink')continue;let weight=e.x-(e.type==='fire'?150:0)-(e.state==='hook'||e.state==='board'?70:0);if(weight<d){d=weight;b=e}}return b}function damageEnemy(e,dmg,kind='cannon'){if(e.dead||e.state==='sink')return;let real=dmg;if(kind==='cannon')real*=1-e.t.armor;if(kind==='arrow'&&e.type==='armored')real*=.55;e.hp-=real;e.hit=.12;pop(e.x,e.y-35,'-'+Math.round(real),'#fff0a0');if(e.hp<=0)killEnemy(e)}
function fireCannon(power=44,manual=false){const target=focus&&!focus.dead?focus:nearestEnemy();ship.cannons.forEach(y=>{const sx=392,sy=y,tx=target?target.x:1250,ty=target?target.y:sy,dx=tx-sx,dy=ty-sy,l=Math.hypot(dx,dy)||1,s=640;balls.push({x:sx,y:sy,vx:dx/l*s,vy:dy/l*s+(Math.random()-.5)*(manual?58:25),dmg:power,life:3,trail:0})});shake=Math.max(shake,manual?9:4)}function fireArrows(n=5,p=13){const shooters=ship.crew.filter(c=>c.alive&&(c.role==='archer'||c.role==='captain'));if(!shooters.length)return;for(let i=0;i<n;i++){const s=shooters[i%shooters.length],t=focus&&!focus.dead?focus:nearestEnemy();if(!t)continue;const dx=t.x-s.x,dy=t.y-s.y,l=Math.hypot(dx,dy)||1;arrows.push({x:s.x,y:s.y,vx:dx/l*510,vy:dy/l*510,dmg:p,life:2,shipShot:true})}}
function board(e){if(e.state==='board')return;e.state='board';e.x=447;e.y=ZONES[e.zone].y+(Math.random()-.5)*38;e.sp=0;planks.push({e,y:e.y,zone:e.zone});e.bt=.1;ui.phase.textContent='登船混战：守住三处甲板！';msg(ZONES[e.zone].label+' 搭板！海盗登船！')}function spawnPirate(e){if(e.board<=0)return;e.board--;const z=ZONES[e.zone];pirates.push({x:e.x-34,y:e.y+(Math.random()-.5)*38,tx:358-Math.random()*125,ty:clamp(z.y+(Math.random()-.5)*100,z.spawnY[0],z.spawnY[1]),zone:e.zone,hp:72+wave*6,max:72+wave*6,atk:8+wave*.75,cd:.25+Math.random()*.5,phase:'cross',src:e,dead:false,speed:74+Math.random()*12})}
function killEnemy(e){if(e.dead)return;e.dead=true;e.state='sink';e.sink=0;e.sp=0;burst(e.x,e.y,25,'#ffb13d',280);smoke(e.x,e.y,10);shake=11;combo++;comboT=2.7;ship.morale=Math.min(100,ship.morale+2);pop(e.x,e.y-55,'击沉 +'+e.t.score*10,'#ffd64f');if(focus===e)focus=null;for(let i=planks.length-1;i>=0;i--)if(planks[i].e===e)planks.splice(i,1)}function hit(x,y,e){return x>e.x-e.w*.5&&x<e.x+e.w*.5&&y>e.y-e.h*.5&&y<e.y+e.h*.5}
function nearCrew(p){let b=null,d=1e9;for(const c of ship.crew){if(!c.alive)continue;const zonePenalty=c.zone===p.zone?0:28000,q=(c.x-p.x)**2+(c.y-p.y)**2+zonePenalty;if(q<d){d=q;b=c}}return b}function nearPirate(c){let b=null,d=1e9;for(const p of pirates){if(p.dead)continue;const zonePenalty=p.zone===c.zone?0:30000,q=(p.x-c.x)**2+(p.y-c.y)**2+zonePenalty;if(q<d){d=q;b=p}}return b}function pressuredZone(){let best='mid',p=-1;zoneKeys.forEach(k=>{if(ZONES[k].pressure>p){p=ZONES[k].pressure;best=k}});return best}
function updateZonePressure(dt){zoneKeys.forEach(k=>{const z=ZONES[k],pir=pirates.filter(p=>!p.dead&&p.zone===k).length,ships=enemies.filter(e=>!e.dead&&e.zone===k&&(e.state==='hook'||e.state==='board')).length,target=clamp(pir*15+ships*18,0,100);z.pressure+=(target-z.pressure)*Math.min(1,dt*3.2);if(z.pressure>=85){z.breach+=dt;ship.morale=Math.max(0,ship.morale-dt*2.2);ship.hp-=dt*5.5}else z.breach=Math.max(0,z.breach-dt*.5)})}
function update(dt){if(paused||gameOver)return;dt*=speed;Object.keys(cd).forEach(k=>cd[k]=Math.max(0,cd[k]-dt));skillUI();comboT=Math.max(0,comboT-dt);if(comboT<=0)combo=0;ui.combo.textContent=combo>1?'连沉 ×'+combo:'';ui.combo.classList.toggle('show',combo>1&&comboT>0);if(spawn.length){spawnT-=dt;if(spawnT<=0){const group=Math.random()<.5?Math.min(2+((Math.random()*3)|0),spawn.length):1;for(let i=0;i<group;i++)addEnemy(spawn.shift());spawnT=.32+Math.random()*.58}}else if(!enemies.length&&!pirates.length){nextWave-=dt;if(nextWave<=0){wave++;if(wave>8)return win();nextWave=1.5;startWave()}}ship.autoC-=dt;ship.autoA-=dt;if(auto&&ship.autoC<=0){fireCannon();ship.autoC=1.18}if(ship.autoA<=0){fireArrows();ship.autoA=1.75}
for(const e of enemies){e.hit=Math.max(0,e.hit-dt);if(e.state==='sail'){e.x-=e.sp*dt;if(e.x<675){e.state='approach';e.sp*=.6}}else if(e.state==='approach'){e.x-=e.sp*dt;if(e.type==='fire'&&e.x<505){const dmg=130+wave*8;ship.hp-=dmg;burst(e.x,e.y,38,'#ff6b28',320);smoke(e.x,e.y,15);shake=14;pop(430,e.y,'火攻 -'+dmg,'#ff725d');killEnemy(e);continue}if(e.x<520){e.state='hook';e.hook=.75;msg(ZONES[e.zone].label+'：'+e.t.name+' 正在抛钩！')}}else if(e.state==='hook'){e.hook-=dt;if(e.hook<=0)board(e)}else if(e.state==='board'){e.bt-=dt;if(e.board>0&&e.bt<=0){spawnPirate(e);e.bt=.34+Math.random()*.22}if(e.board<=0&&!pirates.some(p=>!p.dead&&p.src===e)){e.state='retreat';e.sp=58;for(let i=planks.length-1;i>=0;i--)if(planks[i].e===e)planks.splice(i,1)}}else if(e.state==='retreat'){e.x+=e.sp*dt;if(e.x>W+100)e.dead=true}else if(e.state==='sink'){e.sink+=dt;e.ang+=dt*.2;e.y+=14*dt}}
for(const b of balls){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;b.trail+=dt;if(b.trail>.04){b.trail=0;fx.push({x:b.x-14,y:b.y,vx:-15,vy:0,r:3,life:.2,col:'#d7edf2'})}for(const e of enemies){if(e.dead||e.state==='sink'||b.life<=0)continue;if(hit(b.x,b.y,e)){damageEnemy(e,b.dmg,'cannon');e.recoil=10;b.life=0;burst(b.x,b.y,10,'#ffbd4a',190);smoke(b.x,b.y,3);break}}}
for(const a of arrows){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;if(a.shipShot){for(const e of enemies){if(e.dead||e.state==='sink'||a.life<=0)continue;if(hit(a.x,a.y,e)){damageEnemy(e,a.dmg,'arrow');a.life=0;break}}}else{for(const p of pirates){if(p.dead||a.life<=0)continue;if(Math.hypot(a.x-p.x,a.y-p.y)<18){p.hp-=a.dmg;a.life=0;burst(p.x,p.y,4,'#fff0a8',80);if(p.hp<=0)p.dead=true;break}}}}
for(const p of pirates){if(p.dead)continue;if(p.phase==='cross'){let dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*p.speed*dt;p.y+=dy/d*p.speed*dt;if(d<15)p.phase='fight'}else{p.cd-=dt;const c=nearCrew(p);if(c){let dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy)||1;if(d>34){p.x+=dx/d*p.speed*.72*dt;p.y+=dy/d*p.speed*.72*dt}else if(p.cd<=0){c.hp-=p.atk;p.cd=.7+Math.random()*.35;burst(c.x,c.y,5,'#ff6851',85);if(c.hp<=0){c.alive=false;ship.morale=Math.max(0,ship.morale-8);pop(c.x,c.y,'倒下','#ff8b78')}}}else ship.hp-=p.atk*.4*dt}}
updateZonePressure(dt);const hot=pressuredZone();for(const c of ship.crew){if(!c.alive)continue;c.cd-=dt;c.buff=Math.max(0,c.buff-dt);if(c.role==='sword'&&ZONES[hot].pressure>55)c.zone=hot;else if(c.role==='sword'&&ZONES[c.zone].pressure<35)c.zone=zoneForY(c.hy);const p=nearPirate(c);if(c.role==='sword'||c.role==='captain'){if(p){let dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy)||1,spd=c.role==='sword'?86:60;if(d>34&&d<260){c.x+=dx/d*spd*dt;c.y+=dy/d*spd*dt}else if(d<=42&&c.cd<=0){const bonus=c.buff>0?1.85:1,leader=ship.crew.some(q=>q.alive&&q.role==='captain'&&Math.hypot(q.x-c.x,q.y-c.y)<120)?1.15:1;p.hp-=c.atk*bonus*leader;c.cd=c.buff>0?.36:.6;burst(p.x,p.y,4,'#fff0a8',75);if(p.hp<=0){p.dead=true;ship.morale=Math.min(100,ship.morale+1)}}}else returnHome(c,dt)}else if(c.role==='archer'){if(p&&c.cd<=0){let dx=p.x-c.x,dy=p.y-c.y,l=Math.hypot(dx,dy)||1;arrows.push({x:c.x,y:c.y,vx:dx/l*390,vy:dy/l*390,dmg:c.atk,life:1.2,shipShot:false});c.cd=.88}}else if(c.role==='medic'){if(c.cd<=0){const weak=ship.crew.filter(q=>q.alive&&q.hp<q.max).sort((a,b)=>a.hp-b.hp)[0];if(weak){weak.hp=Math.min(weak.max,weak.hp+10);c.cd=1.25}}}}
trim(pirates,p=>!p.dead);trim(balls,b=>b.life>0&&b.x<W+100&&b.y>-80&&b.y<H+80);trim(arrows,a=>a.life>0&&a.x<W+100&&a.y>-80&&a.y<H+80);for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.95;f.vy*=.95;f.life-=dt}trim(fx,f=>f.life>0);for(const s of smokes){s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=9*dt;s.life-=dt}trim(smokes,s=>s.life>0);for(const t of texts){t.y-=28*dt;t.life-=dt}trim(texts,t=>t.life>0);for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if((e.state==='sink'&&e.sink>2.1)||(e.dead&&e.state!=='sink'))enemies.splice(i,1)}const danger=zoneKeys.filter(k=>ZONES[k].pressure>=55).length;ui.phase.textContent=danger?('甲板告急：'+danger+' 个区域承压'):'海盗舰队来袭';if(ship.hp<=0||ship.morale<=0)lose();hud();shake*=.86}
function trim(a,fn){let j=0;for(let i=0;i<a.length;i++)if(fn(a[i]))a[j++]=a[i];a.length=j}function returnHome(c,dt){let tx=c.hx,ty=c.hy;if(c.role==='sword'&&c.zone!==zoneForY(c.hy)){tx=285;ty=ZONES[c.zone].y}let dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy)||1;if(d>5){c.x+=dx/d*52*dt;c.y+=dy/d*52*dt}}
function hud(){ui.hp.textContent=Math.max(0,ship.hp|0)+'/'+ship.max;ui.hpb.style.width=clamp(ship.hp/ship.max*100,0,100)+'%';ui.mor.textContent=ship.morale|0;ui.morb.style.width=clamp(ship.morale,0,100)+'%';zoneKeys.forEach(k=>{const z=ZONES[k],el=$('zone-'+k),text=$('zone-'+k+'-text'),bar=$('zone-'+k+'-bar'),status=zoneStatus(z.pressure);text.textContent=status+' '+Math.round(z.pressure)+'%';bar.style.width=clamp(z.pressure,0,100)+'%';el.classList.toggle('warn',status==='告急');el.classList.toggle('danger',status==='失守')})}function skillUI(){[['cannonBtn','cannon'],['arrowBtn','arrow'],['repelBtn','repel'],['healBtn','heal']].forEach(([id,k])=>{const b=$(id);if(cd[k]>0){b.classList.add('cool');b.dataset.cd=Math.ceil(cd[k])}else b.classList.remove('cool')})}
function heal(){ship.hp=Math.min(ship.max,ship.hp+200);ship.crew.forEach(c=>{if(c.alive)c.hp=Math.min(c.max,c.hp+50)});ship.morale=Math.min(100,ship.morale+14);zoneKeys.forEach(k=>ZONES[k].pressure*=.82);msg('紧急维修！船体与甲板压力下降')}function repel(){let n=0;ship.crew.forEach(c=>{if(c.alive&&c.role==='sword')c.buff=4});pirates.forEach(p=>{if(!p.dead){p.hp-=58;n++;burst(p.x,p.y,6,'#fff0a8',120);if(p.hp<=0)p.dead=true}});ship.morale=Math.min(100,ship.morale+8);msg(n?'甲板反击！剑士全线增援':'当前没有登船海盗')}function win(){gameOver=true;ui.title.textContent='胜利！';ui.text.textContent='你守住了 8 波三线甲板攻防。V3 已加入三登船区、区域压力、重甲船、火攻船和动态增援。';ui.result.classList.add('show')}function lose(){gameOver=true;ui.title.textContent='旗舰失守';ui.text.textContent='某些甲板区域长期失守，士气与船体被持续压垮。优先清理火攻船和高压登船点。';ui.result.classList.add('show')}
function drawSea(){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1595c7');g.addColorStop(1,'#075a86');X.fillStyle=g;X.fillRect(0,0,W,H);X.globalAlpha=.2;X.strokeStyle='#d8f8ff';X.lineWidth=2;for(let y=90;y<H;y+=58)for(let x=(y%120);x<W;x+=115){X.beginPath();X.arc(x,y,24,3.45,5.85);X.stroke()}X.globalAlpha=1}function rr(x,y,w,h,r,fill=true,stroke=false){X.beginPath();X.roundRect(x,y,w,h,r);if(fill)X.fill();if(stroke)X.stroke()}
function drawCrew(x,y,c){X.save();X.translate(x,y);if(!c.alive){X.globalAlpha=.28;X.rotate(1.1)}let col=c.role==='captain'?'#b88b2a':c.role==='medic'?'#e9e9e9':'#2469a1';X.fillStyle=col;X.fillRect(-10,-6,20,27);X.fillStyle='#e8b478';X.beginPath();X.arc(0,-16,10,0,Math.PI*2);X.fill();X.fillStyle=c.role==='medic'?'#fff':'#173f69';X.fillRect(-11,-27,22,7);X.strokeStyle='#211713';X.lineWidth=3;if(c.role==='archer'){X.beginPath();X.arc(16,-3,11,-1.4,1.4);X.stroke()}else if(c.role==='sword'||c.role==='captain'){X.beginPath();X.moveTo(10,-3);X.lineTo(27,-20);X.stroke()}else if(c.role==='medic'){X.fillStyle='#53c96d';X.fillRect(13,-13,6,20);X.fillRect(6,-6,20,6)}X.fillStyle='#0e1418';X.fillRect(-13,-38,26,4);X.fillStyle='#57df72';X.fillRect(-13,-38,26*clamp(c.hp/c.max,0,1),4);X.restore()}
function drawShip(){X.save();X.translate(ship.x,ship.y);X.fillStyle='#4e2b19';rr(0,0,ship.w,ship.h,88);X.fillStyle='#a76f38';rr(16,16,ship.w-32,ship.h-32,74);X.fillStyle='#cf9d5b';rr(35,32,ship.w-70,ship.h-64,60);X.strokeStyle='#6c4227';X.lineWidth=5;for(let y=95;y<ship.h-50;y+=48){X.beginPath();X.moveTo(42,y);X.lineTo(ship.w-42,y);X.stroke()}X.strokeStyle='#39251a';X.lineWidth=10;X.strokeRect(29,66,ship.w-58,ship.h-132);zoneKeys.forEach(k=>{const z=ZONES[k],localY=z.y-ship.y;X.globalAlpha=.12;X.fillStyle=z.pressure>=85?'#ff4135':z.pressure>=55?'#ffc247':'#69e68d';X.fillRect(ship.w-78,localY-80,37,160);X.globalAlpha=1});X.fillStyle='#24578b';X.fillRect(82,25,86,24);X.fillStyle='#fff';X.font='bold 22px sans-serif';X.fillText('⚓',110,46);ship.cannons.forEach(y=>{X.save();X.translate(302,y-ship.y);X.fillStyle='#5e3b23';X.fillRect(-22,8,42,20);X.fillStyle='#1d252a';X.fillRect(-10,-8,68,26);X.fillStyle='#0c1114';X.beginPath();X.arc(58,5,14,0,Math.PI*2);X.fill();X.restore()});ship.crew.forEach(c=>drawCrew(c.x-ship.x,c.y-ship.y,c));X.restore()}
function drawEnemy(e){X.save();X.translate(e.x+(e.recoil||0),e.y);X.rotate(e.ang);if(e.state==='sink'){X.globalAlpha=clamp(1-e.sink/2.1,0,1);X.translate(0,e.sink*18)}e.recoil*=.82;X.fillStyle=e.type==='armored'?'#42464d':'#6b3b1f';X.beginPath();X.moveTo(-e.w*.5,-e.h*.25);X.quadraticCurveTo(0,-e.h*.55,e.w*.48,-e.h*.24);X.lineTo(e.w*.34,e.h*.42);X.quadraticCurveTo(0,e.h*.57,-e.w*.48,e.h*.31);X.closePath();X.fill();X.fillStyle=e.type==='armored'?'#777d84':'#9a6231';X.fillRect(-e.w*.34,-e.h*.17,e.w*.65,e.h*.39);if(e.type==='armored'){X.strokeStyle='#b8c0c8';X.lineWidth=5;X.strokeRect(-e.w*.34,-e.h*.17,e.w*.65,e.h*.39)}X.strokeStyle='#71431f';X.lineWidth=5;X.beginPath();X.moveTo(-e.w*.14,-e.h*.43);X.lineTo(-e.w*.14,e.h*.15);X.stroke();X.fillStyle=e.t.s;X.beginPath();X.moveTo(-e.w*.13,-e.h*.39);X.lineTo(e.w*.24,-e.h*.30);X.lineTo(e.w*.18,e.h*.05);X.lineTo(-e.w*.13,0);X.closePath();X.fill();X.fillStyle='#fff';X.font='bold 18px sans-serif';X.fillText(e.type==='fire'?'🔥':e.type==='armored'?'🛡':'☠',-e.w*.03,-e.h*.12);X.fillStyle='#111';X.fillRect(-e.w*.35,-e.h*.59,e.w*.7,7);X.fillStyle='#e44435';X.fillRect(-e.w*.35,-e.h*.59,e.w*.7*clamp(e.hp/e.max,0,1),7);if(e.hit){X.globalAlpha=.3;X.fillStyle='#fff';X.fillRect(-e.w*.5,-e.h*.5,e.w,e.h)}X.restore()}
function drawPlank(p){X.save();X.strokeStyle='#5a371e';X.lineWidth=18;X.beginPath();X.moveTo(399,p.y);X.lineTo(p.e.x-p.e.w*.3,p.y);X.stroke();X.strokeStyle='#c58d4d';X.lineWidth=3;for(let i=0;i<5;i++){let x=399+(p.e.x-p.e.w*.3-399)*(i/4);X.beginPath();X.moveTo(x,p.y-9);X.lineTo(x,p.y+9);X.stroke()}X.restore()}function drawPirate(p){X.save();X.translate(p.x,p.y);X.fillStyle='#aa342b';X.fillRect(-10,-5,20,26);X.fillStyle='#e2ad72';X.beginPath();X.arc(0,-15,9,0,Math.PI*2);X.fill();X.fillStyle='#761717';X.fillRect(-12,-25,24,7);X.strokeStyle='#ddd';X.lineWidth=3;X.beginPath();X.moveTo(9,-2);X.lineTo(24,-18);X.stroke();X.fillStyle='#111';X.fillRect(-13,-34,26,4);X.fillStyle='#5adf70';X.fillRect(-13,-34,26*clamp(p.hp/p.max,0,1),4);X.restore()}
function draw(){X.save();X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawSea();drawShip();planks.forEach(drawPlank);enemies.forEach(drawEnemy);for(const b of balls){X.fillStyle='#171b1d';X.beginPath();X.arc(b.x,b.y,10,0,Math.PI*2);X.fill();X.strokeStyle='#dff9ff99';X.lineWidth=4;X.beginPath();X.moveTo(b.x-34,b.y);X.lineTo(b.x-12,b.y);X.stroke()}for(const a of arrows){X.save();X.translate(a.x,a.y);X.rotate(Math.atan2(a.vy,a.vx));X.strokeStyle='#6a361b';X.lineWidth=3;X.beginPath();X.moveTo(-16,0);X.lineTo(7,0);X.stroke();X.restore()}pirates.forEach(drawPirate);for(const s of smokes){X.globalAlpha=clamp(s.life/1.5,0,1)*.45;X.fillStyle='#25303a';X.beginPath();X.arc(s.x,s.y,s.r,0,Math.PI*2);X.fill()}X.globalAlpha=1;for(const f of fx){X.globalAlpha=clamp(f.life/.7,0,1);X.fillStyle=f.col;X.beginPath();X.arc(f.x,f.y,f.r,0,Math.PI*2);X.fill()}X.globalAlpha=1;X.font='bold 18px sans-serif';X.textAlign='center';for(const t of texts){X.globalAlpha=clamp(t.life/.8,0,1);X.fillStyle=t.col;X.fillText(t.t,t.x,t.y)}X.globalAlpha=1;X.textAlign='left';if(focus&&!focus.dead){X.strokeStyle='#ffd84b';X.lineWidth=4;X.setLineDash([10,8]);X.beginPath();X.ellipse(focus.x,focus.y,focus.w*.62,focus.h*.7,0,0,Math.PI*2);X.stroke();X.setLineDash([])}X.restore()}
function frame(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}$('autoBtn').onclick=()=>{auto=!auto;$('autoBtn').classList.toggle('on',auto);msg(auto?'自动炮击：开启':'自动炮击：关闭')};$('cannonBtn').onclick=()=>{if(cd.cannon<=0){fireCannon(108,true);cd.cannon=cdm.cannon;msg('大炮齐射！')}};$('arrowBtn').onclick=()=>{if(cd.arrow<=0){fireArrows(26,35);cd.arrow=cdm.arrow;msg('箭雨覆盖！')}};$('repelBtn').onclick=()=>{if(cd.repel<=0){repel();cd.repel=cdm.repel}};$('healBtn').onclick=()=>{if(cd.heal<=0){heal();cd.heal=cdm.heal}};$('pauseBtn').onclick=()=>{paused=!paused;$('pauseBtn').textContent=paused?'▶':'Ⅱ'};$('speedBtn').onclick=()=>{speed=speed===1?1.5:speed===1.5?2:1;$('speedBtn').textContent='×'+speed};$('restartBtn').onclick=reset;C.addEventListener('pointerdown',ev=>{const r=C.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;let h=null;for(const e of enemies){if(e.dead||e.state==='sink')continue;if(hit(x,y,e)){h=e;break}}focus=h;if(h)msg('集中火力：'+h.t.name+' / '+ZONES[h.zone].label)});reset();requestAnimationFrame(frame);
})();
