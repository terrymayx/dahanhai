<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>大航海时代 V4.0 - 船员编队版</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061822;font-family:Arial,"Microsoft YaHei";color:#fff}#g{position:fixed;inset:0;margin:auto;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#087ba9;overflow:hidden}canvas{width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none;text-shadow:0 2px 3px #000}.top{position:absolute;left:2%;top:2%;font-weight:900}.bar{width:270px;height:14px;background:#172631;border-radius:8px;overflow:hidden;margin:3px 0 7px}.bar i{display:block;height:100%;background:#e84e3e}.bar.blue i{background:#2bb9e1}.wave{position:absolute;left:50%;top:2%;transform:translateX(-50%);background:#4c301add;border:2px solid #af8245;border-radius:9px;padding:6px 16px;font-weight:900;text-align:center}.zones{position:absolute;right:2%;top:17%;width:220px;display:grid;gap:7px;pointer-events:auto}.zone{background:#092634e8;border:2px solid #466777;border-radius:9px;padding:7px;cursor:pointer}.zone.warn{border-color:#e0ad43}.zone.danger{border-color:#f25443;box-shadow:0 0 12px #f2544388}.row{display:flex;justify-content:space-between;font-weight:900}.track{height:7px;background:#152b36;border-radius:5px;margin-top:5px;overflow:hidden}.track i{display:block;height:100%;background:#58d87c}.skills{position:absolute;left:2%;bottom:3%;display:flex;gap:10px;pointer-events:auto}.skills button{width:72px;height:72px;border-radius:50%;border:3px solid #27353d;background:#20313a;color:white;font-size:29px;position:relative}.skills span{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font-size:11px;white-space:nowrap}.on{outline:3px solid #58e47a}.prep{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:460px;background:#071d29ee;border:3px solid #d2a24d;border-radius:14px;padding:16px;text-align:center;display:none}.prep.show{display:block}.prep h2{margin:0}.count{font-size:46px;color:#ffe36a;font-weight:900}.threat{background:#173443;margin:5px 0;padding:6px;border-radius:7px;text-align:left}.info{position:absolute;left:30%;bottom:3%;background:#071e2bdd;border:2px solid #365868;border-radius:8px;padding:7px 10px;max-width:38%;font-size:12px}.msg{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-size:28px;color:#ffe36a;font-weight:900;opacity:0}.msg.show{opacity:1}.result{position:absolute;inset:0;background:#00131ddd;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:auto}.result.show{display:flex}.result button{padding:10px 24px;font-weight:900;font-size:20px}.topBtns{position:absolute;right:2%;top:2%;pointer-events:auto}.topBtns button{width:48px;height:48px;background:#294250;color:#fff;border:2px solid #14242e;border-radius:9px;font-size:20px}
</style></head><body><div id="g"><canvas id="c" width="1600" height="900"></canvas><div class="ui"><div class="top">旗舰 <b id="hp">1650/1650</b><div class="bar"><i id="hpb"></i></div>士气 <b id="mor">100</b><div class="bar blue"><i id="morb"></i></div></div><div class="wave">第 <span id="wave">1</span>/8 波<br><small id="phase">整备阶段</small></div><div class="topBtns"><button id="pause">Ⅱ</button><button id="speed">×1</button></div><div class="zones" id="zones"></div><div class="skills"><button id="auto" class="on">⚙<span>自动炮击</span></button><button id="cannon">💥<span>齐射</span></button><button id="arrow">🏹<span>箭雨</span></button><button id="repel">⚔<span>反击</span></button><button id="heal">➕<span>维修</span></button></div><div class="info" id="info">点击船员，再点击右侧甲板调动。剑士近战、弓箭远攻、炮手强化舰炮、医生治疗、船长增益。</div><div class="prep" id="prep"><h2>战前整备</h2><div class="count" id="count">8.0</div><div id="threats"></div></div><div class="msg" id="msg"></div><div class="result" id="result"><h1 id="rt">胜利</h1><p id="rd"></p><button id="restart">重新开始</button></div></div></div><script>
(()=>{const D=document,$=id=>D.getElementById(id),C=$('c'),X=C.getContext('2d'),W=1600,H=900;const Z={upper:{l:'上甲板',y:250,cap:4,p:0},mid:{l:'中甲板',y:450,cap:4,p:0},lower:{l:'下甲板',y:650,cap:4,p:0}},K=['upper','mid','lower'];const RN={sword:'剑士',archer:'弓箭手',gunner:'炮手',medic:'医生',captain:'船长'},PR=['normal','brute','shooter','bomber','captain'];let wave=1,mode='prep',prep=6,spawn=[],st=0,last=0,paused=false,spd=1,over=false,auto=true,sel=null,focus=null;const E=[],P=[],B=[],A=[],FX=[];const ship={hp:1650,max:1650,mor:100,crew:[],cannon:0,arrow:0};const spots=[[185,205,'archer','upper'],[270,250,'sword','upper'],[215,310,'gunner','upper'],[185,405,'archer','mid'],[275,450,'sword','mid'],[215,515,'captain','mid'],[185,605,'archer','lower'],[275,650,'sword','lower'],[215,710,'medic','lower']];spots.forEach((s,i)=>ship.crew.push({id:i,x:s[0],y:s[1],hx:s[0],hy:s[1],r:s[2],z:s[3],hp:100,max:100,cd:0,alive:true,sel:false}));const T={skiff:{n:'突击艇',hp:80,sp:72,b:2,w:105,h:60},pirate:{n:'海盗船',hp:150,sp:52,b:4,w:138,h:78},boarder:{n:'登船船',hp:245,sp:42,b:6,w:165,h:92},fire:{n:'火攻船',hp:75,sp:86,b:0,w:112,h:64},armored:{n:'重甲船',hp:360,sp:35,b:5,w:178,h:98}};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),zoneCapacity=k=>Z[k].cap,countCrew=k=>ship.crew.filter(c=>c.alive&&c.z===k).length,canMoveCrew=(c,n,k)=>!!c&&c.alive&&n<zoneCapacity(k);function enemyPirateRoles(){return PR.slice()}function previewForWave(n){let a=[{zone:'upper',text:'突击艇快速接近'},{zone:'mid',text:'海盗船持续压制'},{zone:'lower',text:'登船船集中靠帮'}];if(n>=3)a.push({zone:n%2?'upper':'mid',text:'火攻船出现'});if(n>=5)a.push({zone:n%2?'lower':'upper',text:'重甲船护送'});if(n>=6)a.push({zone:'mid',text:'爆破手与海盗头目'});return{wave:n,threats:[a[n%a.length],a[(n+2)%a.length],a[(n+4)%a.length]]}}window.__gameTest={zoneCapacity,enemyPirateRoles,previewForWave,canMoveCrew};
function msg(t){$('msg').textContent=t;$('msg').classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>$('msg').classList.remove('show'),800)}function zhome(k,i){return{x:[185,275,215,325][i%4],y:Z[k].y+[-55,-15,28,62][i%4]}}function reorganize(k){ship.crew.filter(c=>c.alive&&c.z===k).forEach((c,i)=>Object.assign(c,{hx:zhome(k,i).x,hy:zhome(k,i).y}))}function select(c){sel=c;ship.crew.forEach(x=>x.sel=x===c);$('info').innerHTML=c?`已选择 <b>${RN[c.r]}</b> · ${Z[c.z].l} · HP ${c.hp|0}/100`:'点击船员，再点击右侧甲板调动。'}function move(c,k){if(!c||!c.alive)return;if(c.z===k)return msg('已经在'+Z[k].l);if(!canMoveCrew(c,countCrew(k),k))return msg(Z[k].l+'已满员');let o=c.z;c.z=k;reorganize(o);reorganize(k);select(c);msg(RN[c.r]+'调往'+Z[k].l)}
function zonesUI(){$('zones').innerHTML=K.map(k=>`<div class="zone" id="z-${k}"><div class="row"><span>${Z[k].l}</span><span id="zs-${k}">安全</span></div><div class="row"><small id="zc-${k}">3/4 人</small><small>点击调动</small></div><div class="track"><i id="zb-${k}"></i></div></div>`).join('');K.forEach(k=>$('z-'+k).onclick=()=>sel?move(sel,k):msg('先选择船员'))}zonesUI();
function beginPrep(first=false){mode='prep';prep=first?6:8;$('prep').classList.add('show');$('phase').textContent='整备阶段';let p=previewForWave(wave);$('threats').innerHTML=p.threats.map(t=>`<div class="threat"><b>${Z[t.zone].l}</b>：${t.text}</div>`).join('');ship.crew.forEach(c=>{if(c.alive)c.hp=Math.min(100,c.hp+10)});ship.hp=Math.min(ship.max,ship.hp+35);ship.mor=Math.min(100,ship.mor+5)}function pool(){return wave<3?['skiff','skiff','pirate']:wave<5?['skiff','pirate','pirate','boarder']:['skiff','pirate','boarder','fire','armored']}function beginWave(){mode='battle';$('prep').classList.remove('show');spawn=[];let q=pool();for(let i=0;i<Math.min(9+wave*2,24);i++)spawn.push(q[Math.random()*q.length|0]);st=.2;$('phase').textContent='海盗舰队来袭';msg('第 '+wave+' 波！')}function addEnemy(k){let t=T[k],pr=previewForWave(wave),z=Math.random()<.65?pr.threats[Math.random()*pr.threats.length|0].zone:K[Math.random()*3|0];E.push({k,t,z,x:1660+Math.random()*160,y:Z[z].y+(Math.random()-.5)*90,hp:t.hp*(1+wave*.08),max:t.hp*(1+wave*.08),state:'sail',board:t.b})}function nearest(){return E.filter(e=>e.state!=='sink').sort((a,b)=>(a.x-(a.k==='fire'?150:0))-(b.x-(b.k==='fire'?150:0)))[0]}function gunner(){return ship.crew.filter(c=>c.alive&&c.r==='gunner').length}function fire(power=45){let e=focus&&focus.state!=='sink'?focus:nearest();if(!e)return;for(let y of [280,390,500,610]){let dx=e.x-390,dy=e.y-y,l=Math.hypot(dx,dy)||1;B.push({x:390,y,vx:dx/l*650,vy:dy/l*650,d:power*(1+gunner()*.16),life:3})}}function arrows(n=5,d=13){let s=ship.crew.filter(c=>c.alive&&c.r==='archer'),e=nearest();if(!s.length||!e)return;for(let i=0;i<n;i++){let c=s[i%s.length],dx=e.x-c.x,dy=e.y-c.y,l=Math.hypot(dx,dy)||1;A.push({x:c.x,y:c.y,vx:dx/l*500,vy:dy/l*500,d,life:2,ship:true})}}
function prole(){let r=Math.random();return wave<3?(r<.75?'normal':'brute'):wave<5?(r<.5?'normal':r<.72?'brute':r<.88?'shooter':'bomber'):(r<.34?'normal':r<.55?'brute':r<.72?'shooter':r<.9?'bomber':'captain')}function spawnPirate(e){if(e.board<=0)return;e.board--;let r=prole(),m=r==='brute'?1.7:r==='captain'?1.3:1;P.push({r,z:e.z,x:445,y:e.y,hp:(70+wave*6)*m,max:(70+wave*6)*m,cd:0,bomb:r==='bomber'?6:0})}function nearCrew(p){return ship.crew.filter(c=>c.alive&&c.z===p.z).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0]}function nearPirate(c){return P.filter(p=>p.z===c.z).sort((a,b)=>Math.hypot(a.x-c.x,a.y-c.y)-Math.hypot(b.x-c.x,b.y-c.y))[0]}
function update(dt){if(paused||over)return;dt*=spd;if(mode==='prep'){prep-=dt;$('count').textContent=Math.max(0,prep).toFixed(1);moveHome(dt);if(prep<=0)beginWave();return hud()}if(spawn.length){st-=dt;if(st<=0){for(let i=0,n=Math.random()<.5?Math.min(3,spawn.length):1;i<n;i++)addEnemy(spawn.shift());st=.35+Math.random()*.5}}else if(!E.length&&!P.length){wave++;if(wave>8)return win();return beginPrep()}ship.cannon-=dt;ship.arrow-=dt;if(auto&&ship.cannon<=0){fire();ship.cannon=Math.max(.75,1.2-gunner()*.13)}if(ship.arrow<=0){arrows();ship.arrow=1.8}
for(let e of E){if(e.state==='sail'){e.x-=e.t.sp*dt;if(e.x<650)e.state='approach'}else if(e.state==='approach'){e.x-=e.t.sp*.58*dt;if(e.k==='fire'&&e.x<505){ship.hp-=130+wave*8;e.state='sink';continue}if(e.x<520){e.state='hook';e.h=.7}}else if(e.state==='hook'){e.h-=dt;if(e.h<=0){e.state='board';e.x=445;e.y=Z[e.z].y;e.bt=.1}}else if(e.state==='board'){e.bt-=dt;if(e.board>0&&e.bt<=0){spawnPirate(e);e.bt=.4}if(e.board<=0&&!P.some(p=>p.src===e)){e.state='retreat'}}else if(e.state==='retreat'){e.x+=60*dt;if(e.x>1700)e.state='sink'}}
for(let b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of E){if(e.state==='sink'||b.life<=0)continue;if(Math.abs(b.x-e.x)<e.t.w/2&&Math.abs(b.y-e.y)<e.t.h/2){e.hp-=b.d*(e.k==='armored'?.62:1);b.life=0;if(e.hp<=0)e.state='sink'}}}for(let a of A){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;for(let e of E){if(e.state==='sink'||a.life<=0)continue;if(Math.abs(a.x-e.x)<e.t.w/2&&Math.abs(a.y-e.y)<e.t.h/2){e.hp-=a.d*(e.k==='armored'?.55:1);a.life=0;if(e.hp<=0)e.state='sink'}}}
for(let p of P){if(p.r==='bomber'){p.bomb-=dt;if(p.bomb<=0){ship.hp-=95+wave*7;Z[p.z].p=Math.min(100,Z[p.z].p+28);p.hp=0;continue}}let c=nearCrew(p);if(!c){ship.hp-=4*dt;continue}let dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy)||1;if(p.r==='shooter'){p.cd-=dt;if(p.cd<=0){c.hp-=8+wave*.7;p.cd=1.2}}else if(d>35){p.x+=dx/d*65*dt;p.y+=dy/d*65*dt}else{p.cd-=dt;if(p.cd<=0){c.hp-=(8+wave*.7)*(p.r==='brute'?1.45:1);p.cd=.75}}if(c.hp<=0){c.alive=false;ship.mor-=9;reorganize(c.z)}}for(let c of ship.crew){if(!c.alive)continue;let p=nearPirate(c);c.cd-=dt;if(c.r==='sword'||c.r==='captain'){if(p){let dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy)||1;if(d>35){c.x+=dx/d*75*dt;c.y+=dy/d*75*dt}else if(c.cd<=0){p.hp-=c.r==='captain'?19:18;c.cd=.6}}}else if(c.r==='archer'&&p&&c.cd<=0){p.hp-=13;c.cd=.9}else if(c.r==='medic'&&c.cd<=0){let w=ship.crew.filter(q=>q.alive&&q.z===c.z&&q.hp<100).sort((a,b)=>a.hp-b.hp)[0];if(w){w.hp=Math.min(100,w.hp+10);c.cd=1.2}}}K.forEach(k=>{let n=P.filter(p=>p.hp>0&&p.z===k).length,s=E.filter(e=>e.state==='board'&&e.z===k).length,tar=clamp(n*15+s*18-countCrew(k)*4,0,100);Z[k].p+=(tar-Z[k].p)*Math.min(1,dt*3);if(Z[k].p>85){ship.hp-=5*dt;ship.mor-=2*dt}});moveHome(dt);E.splice(0,E.length,...E.filter(e=>e.state!=='sink'));P.splice(0,P.length,...P.filter(p=>p.hp>0));B.splice(0,B.length,...B.filter(b=>b.life>0));A.splice(0,A.length,...A.filter(a=>a.life>0));if(ship.hp<=0||ship.mor<=0)lose();hud()}
function moveHome(dt){for(let c of ship.crew){if(!c.alive)continue;let fight=P.some(p=>p.z===c.z);if(!fight||['archer','gunner','medic'].includes(c.r)){let dx=c.hx-c.x,dy=c.hy-c.y,d=Math.hypot(dx,dy)||1;if(d>4){c.x+=dx/d*50*dt;c.y+=dy/d*50*dt}}}}function hud(){$('hp').textContent=(ship.hp|0)+'/'+ship.max;$('hpb').style.width=clamp(ship.hp/ship.max*100,0,100)+'%';$('mor').textContent=Math.max(0,ship.mor|0);$('morb').style.width=clamp(ship.mor,0,100)+'%';$('wave').textContent=wave;K.forEach(k=>{let s=Z[k].p>=85?'失守':Z[k].p>=55?'告急':'安全',e=$('z-'+k);$('zs-'+k).textContent=s;$('zc-'+k).textContent=countCrew(k)+'/4 人';$('zb-'+k).style.width=Z[k].p+'%';e.classList.toggle('warn',s==='告急');e.classList.toggle('danger',s==='失守')})}
function drawPerson(c,enemy=false){X.save();X.translate(c.x,c.y);if(c.sel){X.strokeStyle='#6cf2ff';X.lineWidth=4;X.beginPath();X.arc(0,-5,24,0,7);X.stroke()}X.fillStyle=enemy?'#a8322b':c.r==='captain'?'#b88b2a':c.r==='medic'?'#eee':c.r==='gunner'?'#777':'#2670a8';X.fillRect(-10,-5,20,26);X.fillStyle='#e3ad72';X.beginPath();X.arc(0,-15,9,0,7);X.fill();X.restore()}function draw(){X.fillStyle='#0d82b4';X.fillRect(0,0,W,H);X.fillStyle='#4e2b19';X.beginPath();X.roundRect(72,82,320,736,85);X.fill();X.fillStyle='#c99554';X.beginPath();X.roundRect(105,112,250,676,60);X.fill();X.strokeStyle='#704527';X.lineWidth=5;[350,560].forEach(y=>{X.beginPath();X.moveTo(110,y);X.lineTo(350,y);X.stroke()});ship.crew.filter(c=>c.alive).forEach(c=>drawPerson(c));for(let e of E){X.save();X.translate(e.x,e.y);X.fillStyle=e.k==='armored'?'#555':'#67401f';X.beginPath();X.ellipse(0,0,e.t.w/2,e.t.h/2,0,0,7);X.fill();X.fillStyle=e.k==='fire'?'#b43c24':'#17191c';X.fillRect(-10,-e.t.h/2,18,e.t.h*.65);X.fillStyle='#fff';X.font='16px sans-serif';X.fillText(e.k==='fire'?'🔥':'☠',5,-8);X.fillStyle='#111';X.fillRect(-e.t.w/2,-e.t.h/2-12,e.t.w,6);X.fillStyle='#e44';X.fillRect(-e.t.w/2,-e.t.h/2-12,e.t.w*Math.max(0,e.hp/e.max),6);X.restore()}P.forEach(p=>drawPerson({x:p.x,y:p.y,r:'x',sel:false},true));for(let b of B){X.fillStyle='#111';X.beginPath();X.arc(b.x,b.y,9,0,7);X.fill()}for(let a of A){X.fillStyle='#ffe4a6';X.fillRect(a.x,a.y,12,2)}if(focus){X.strokeStyle='#ffd84b';X.lineWidth=3;X.beginPath();X.ellipse(focus.x,focus.y,focus.t.w*.65,focus.t.h*.7,0,0,7);X.stroke()}}
function win(){over=true;$('rt').textContent='胜利！';$('rd').textContent='8波海盗全部击退。';$('result').classList.add('show')}function lose(){over=true;$('rt').textContent='旗舰失守';$('rd').textContent='调整编队后再战。';$('result').classList.add('show')}function reset(){wave=1;mode='prep';over=false;E.length=P.length=B.length=A.length=0;ship.hp=1650;ship.mor=100;ship.crew.forEach((c,i)=>Object.assign(c,{x:spots[i][0],y:spots[i][1],hx:spots[i][0],hy:spots[i][1],z:spots[i][3],hp:100,alive:true}));K.forEach(k=>Z[k].p=0);select(null);$('result').classList.remove('show');beginPrep(true);hud()}function frame(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}
$('auto').onclick=()=>{auto=!auto;$('auto').classList.toggle('on',auto)};$('cannon').onclick=()=>mode==='battle'&&fire(105);$('arrow').onclick=()=>mode==='battle'&&arrows(20,34);$('repel').onclick=()=>P.forEach(p=>p.hp-=45);$('heal').onclick=()=>{ship.hp=Math.min(ship.max,ship.hp+180);ship.crew.forEach(c=>c.alive&&(c.hp=Math.min(100,c.hp+35)))};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};$('speed').onclick=()=>{spd=spd===1?1.5:spd===1.5?2:1;$('speed').textContent='×'+spd};$('restart').onclick=reset;C.addEventListener('pointerdown',e=>{let r=C.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H,c=ship.crew.find(c=>c.alive&&Math.hypot(x-c.x,y-c.y)<28);if(c)return select(c);focus=E.find(q=>Math.abs(x-q.x)<q.t.w/2&&Math.abs(y-q.y)<q.t.h/2)||null});reset();requestAnimationFrame(frame)})();
</script></body></html>
